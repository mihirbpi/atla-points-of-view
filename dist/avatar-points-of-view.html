window.ATLA.pov.iroh = {

  '1x01': {
    text: [
      'He is introduced dozing in a chair on the deck of his nephew\'s ship while that nephew practises firebending in front of him, and his one piece of coaching is that Zuko\'s basics are sloppy and he should do it again. Then the light goes up in the south and Iroh — a retired general, a man who once besieged Ba Sing Se for six hundred days — declares it celestial, unremarkable, and suggests they finish the game and go to bed.',
      'On a first watch he is the comic uncle. On a second he is doing something quite deliberate. Iroh has already worked out that there is nothing at the end of this hunt that will fix what is wrong with Zuko, and every day he can slow it down is a day he still has him. The stalling begins in the first episode and nobody notices for two seasons.'
    ],
    beat: 'The stalling starts in episode one, and it is love, not laziness.'
  },

  '1x02': {
    text: [
      'He watches his nephew find the Avatar, capture the Avatar, and lose the Avatar inside a single afternoon, and his commentary throughout is gentle and largely concerned with when they might eat. When Aang comes up out of the sea inside a column of water with his eyes burning white, Iroh is the only person on that deck who is not frightened — he simply notes that they are going to need to be more careful.',
      'What he never does, here or anywhere in Book One, is tell Zuko the hunt is hopeless. He knows it is. He says nothing, because the moment he says it Zuko stops listening to him about anything else, and Iroh has decided that keeping the channel open matters more than being right out loud.'
    ],
    beat: 'Chooses to be underestimated, because it is the only position Zuko will hear him from.'
  },

  '1x03': {
    text: [
      'Zhao humiliates Zuko in front of his own crew, and Iroh — who outranks every man on that dock, who is the most decorated soldier of his generation, and who could have ended the conversation with a sentence — stands back and lets his sixteen-year-old nephew fight his own duel.',
      'He does step in once: when Zhao throws a cheap shot at Zuko\'s back after losing, Iroh catches the man\'s wrist without appearing to move, and the temperature of the scene changes for exactly one second. It is the first hint that the doddering old man on the ship is something else entirely.',
      'Then he tells Zuko he is proud of him — not for winning, for showing restraint. It is the first lesson of the season and it goes straight past.'
    ],
    beat: 'Could end any fight in this season in one move, and declines to, on purpose.'
  },

  '1x04': {
    text: [
      'His actual contribution to the episode is a map. Zuko demands to know where the Avatar is, and Iroh lays out the reports — sightings scattered across half a hemisphere, in places no one could travel between — to make a point his nephew refuses to take: you are not tracking him, you are chasing rumours, and this could go on for the rest of your life.',
      'And then, while Kyoshi Island burns, Iroh is looking for a lost Pai Sho tile. He complains about it at length. It is played as pure comic business — an old man delaying a military operation over a game piece.',
      'It is the white lotus tile. It is a membership token in a secret society that runs across all four nations, above the war and older than it, and Iroh will use it in Book Two to summon a room full of the most dangerous old men alive. The single largest piece of setup in the series is hidden inside a gag in episode four, and Iroh delivers it while whining about his luggage.'
    ],
    beat: 'The biggest secret in the show, planted in a joke about a board game.'
  },

  '1x05': { away: true, text: 'Off-screen. Somewhere in the eastern sea a retired general is making tea nobody asked for and describing it in detail to a crew that has learned when to nod. Aang, this week, is being taught by a mad king that the only way to solve an impossible problem is to stop attacking it from the front. Iroh would have liked Bumi enormously, and will in fact turn out to know him.' },

  '1x06': { away: true, text: 'Off-screen, while the Fire Nation runs a rig full of earthbenders parked deliberately out of reach of the earth. Iroh spent forty years building and commanding the machine that fills places like that. He knows precisely how it works, what it does to people, and what it costs — which is the whole reason he behaves the way he does now, and he will not explain that to anyone for another season.' },

  '1x07': {
    text: [
      'He wanders off the trail to sit in a hot spring, because he is in his sixties and the water is warm and the war has been going on for a hundred years and will still be there in an hour. An Earth Kingdom patrol finds him naked in a pool and takes him without a fight.',
      'He lets them. He lets them chain him, walk him, and set him down for execution — and then, at the moment he chooses, he heats the metal cuffs until they are soft, breaks them, and disassembles the entire squad in roughly eight seconds using nothing but the chain and short, economical bursts of fire.',
      'And then Zuko arrives to rescue him, and Iroh lets him believe that is what happened. Those eight seconds are the only sustained look Book One gives you at the Dragon of the West, and he puts it away immediately.'
    ],
    beat: 'Eight seconds of what he actually is, and then straight back into the act.'
  },

  '1x08': {
    text: [
      'He tries to talk Zuko out of sailing into Fire Nation waters on the solstice — the argument is sound, the risk is a death sentence, and it does not work — and then he covers for him anyway. When Zhao\'s officers come asking, Iroh performs a rambling, harmless, slightly senile old man so completely that a Fire Navy admiral simply stops paying attention to him.',
      'It is worth being clear about what this actually is. Iroh is a former Crown Prince and the most famous general in the nation, spending his retirement hiding a disgraced boy from the entire military apparatus of the country he built, alone, by pretending to be a fool. He keeps that performance running for two full seasons and never once breaks it in front of anyone who matters.'
    ],
    beat: 'The bumbling-uncle act is a full-time job, and he is very good at it.'
  },

  '1x09': {
    text: [
      'A day of pirates and stolen scrolls, and Iroh\'s entire contribution is to get distracted in the market and buy a tsungi horn, then be delighted about it.',
      'There is no hidden lesson in this one, and that is deliberate. Part of the design of Iroh is that not everything he does is instruction. He genuinely likes music, and shopping, and tea, and being alive — in the middle of a war, on a ship going nowhere good, chaperoning a boy who is destroying himself. The good humour is not a strategy. It is the thing he is trying to teach by having it.'
    ],
    beat: 'Sometimes he is simply an old man who wanted a horn.'
  },

  '1x10': { away: true, text: 'Off-screen. In a forest this week, a boy who lost his family to the Fire Nation decides that a valley full of civilians is an acceptable price for revenge, and loses everyone who loved him over it. Iroh lost his only son at the walls of Ba Sing Se, in a siege he was personally commanding, and came home and did the exact opposite. Nobody in Book One knows that about him yet.' },

  '1x11': { away: true, text: 'Off-screen, while two tribes give up a century of hatred because someone offered them a better story about how it started. Iroh would have approved enormously, at length, over a second pot, with at least one proverb that only half applies.' },

  '1x12': {
    text: [
      'He tells the story his nephew cannot. Zuko is up on deck in the rain refusing to come in, and Iroh sits down with the crew — men who have spent three years being shouted at by a teenager and have never been told why — and gives them the war council, the boy who spoke out of turn, the general who wanted to spend a division of recruits as bait, and the father who called it disrespect and demanded an Agni Kai for it.',
      'And then the detail that reframes him entirely: Iroh was in that arena. He was standing at the rail when his thirteen-year-old nephew knelt and begged and his brother burned his face, and Iroh looked away. He has not been able to put that down since, and everything he has done in the three years since — the ship, the tea, the stalling, the jokes — is a man trying to be worth something to a boy he failed once in the only moment that counted.',
      'In the present he also, almost incidentally, catches a lightning strike coming off the mast, routes it through his own body and out to sea, and says nothing at all about having invented the technique.'
    ],
    beat: 'He was there, and he could not stop it. Everything else about him follows from that.'
  },

  '1x13': {
    text: [
      'His nephew disappears for a night and a masked swordsman appears at Pohuai Stronghold, and Iroh notices both facts and mentions neither. When Zuko comes back wounded and lies about where he has been, Iroh accepts the lie completely and offers him tea.',
      'The conversation he starts instead is about who Zuko wants to be, framed with enormous care as being about nothing in particular — the kind of question that can be walked away from without anyone losing face. Zuko walks away from it. Iroh lets him, and puts it back on the table three episodes later, and again after that.'
    ],
    beat: 'Knows exactly what his nephew did, and lets him keep the secret.'
  },

  '1x14': { away: true, text: 'Off-screen. In a village this week, an entire population outsources its decisions to a fortuneteller who admits at the end that she tells people the futures they need in order to keep going. Iroh reads Pai Sho tiles, which is a different practice entirely, and he would explain the difference at some length and it would somehow end up being about Zuko.' },

  '1x15': {
    text: [
      'He is unreservedly delighted by June — flirts with a bounty hunter a third of his age, in front of his nephew, in a bar, and is entirely unembarrassed about it — and he treats a serious manhunt as an evening out with an interesting new acquaintance.',
      'And underneath the pleasant afternoon he is doing arithmetic. This is the fifteenth episode of watching a sixteen-year-old chase a twelve-year-old across the world, and Iroh is quietly measuring how much of Zuko is left and how much longer the thing will hold. He does not say so. He orders another drink.'
    ],
    beat: 'Enjoying himself in public, keeping count in private.'
  },

  '1x16': { away: true, text: 'Off-screen, while Jeong Jeong tells a child that fire only destroys and that a firebender\'s only virtue is refusing to use it. Iroh is the standing counter-argument to that — a man who has done more with fire than anyone alive and has spent his retirement trying to teach one boy that the point of the power is what you decline to do with it. The two men have almost certainly sat at the same Pai Sho table.' },

  '1x17': { away: true, text: 'Off-screen. In the mountains an engineer is handing the Fire Nation a new weapon every month to keep his colony from being burned. Iroh has spent his whole life watching people make exactly that bargain, from the side that offers it — and, once, from the side that had to be given the choice about Ba Sing Se and made it.' },

  '1x18': {
    text: [
      'Zhao takes Zuko\'s command, then has his ship destroyed in harbour, and Iroh has to stand in front of the man who did it and be convincingly bereaved. He does. He grieves at Zhao\'s table so plausibly that nobody thinks to check whether a body was recovered, which is the single most useful lie he tells all season and the most expensive one to perform.',
      'And then he accepts a post as Zhao\'s advisor for the northern campaign. He walks straight into the invasion — a retired general lending his name and his reputation to an assault he intends to stop, positioned close enough to the man in charge to argue with him.'
    ],
    beat: 'Buries his nephew in public so that he can keep him.'
  },

  '1x19': {
    text: [
      'He sails north as an admiral\'s advisor and spends the siege trying to talk Zhao out of the one thing he must not do. When Zhao halts the night assault because waterbenders are stronger under a full moon, Iroh has to watch a man reason his way toward exactly the wrong conclusion — that the moon is the problem, and that problems can be removed.',
      'He tells him plainly. The Moon and the Ocean are among the oldest spirits there are, they gave waterbending to the world, and they hold something in balance that a fleet does not get to adjust. Zhao hears a superstitious old man being difficult, which is what everyone hears, which is a cost of the act that Iroh has been paying since episode one and it finally comes due here.'
    ],
    beat: 'Says the one true thing out loud, to the one man who cannot hear it.'
  },

  '1x20': {
    text: [
      'The act ends. When Zhao pulls the white koi out of the Spirit Oasis in a bag, Iroh stops being an advisor, a general, or a Fire Nation officer, and warns him once — that whatever he does to that spirit, Iroh will do to him. Zhao kills it anyway, the moon goes out, and Iroh turns on his own nation in front of witnesses, wrecking Zhao\'s guard in seconds and forcing the fish back into the water. Too late.',
      'Then he does the quiet work: finds Aang, gets him back to his friends, and stands aside for the Ocean Spirit. When the fleet is gone and Zhao is under the water, Iroh does not try to salvage a rank, a command, or a way back. He gets into a small boat with a nephew who has nothing at all.',
      'He is sixty-something years old. He has just given up his nation, his name, his standing and any possibility of going home, in public, on a single night, in exchange for a boy who is not his son. He never once frames it as a sacrifice.'
    ],
    beat: 'Chooses his nephew over his country, in the open, and never mentions the cost.'
  }
};

window.ATLA.pov.toph = {

  '1x01': { away: true, text: [
    'At the far end of the world from the South Pole, in the richest house in Gaoling, a twelve-year-old girl is being helped down a staircase by a servant who is worse at stairs than she is. Her parents have told the entire Earth Kingdom that their daughter is blind, tiny and fragile. One of those is true.',
    'Katara begins this series as the only bender left in a village that needs her. Toph begins it as the best bender on the continent in a house that has decided she is not one.'

  '1x03': { away: true, text: [

    'It makes her the only human being alive taught by the source rather than by a school. It is also why her style is nothing like anyone else\'s, and why, in Book Two, she is going to be a genuinely terrible teacher.'

  '1x06': { away: true, text: [

  '1x07': { away: true, text: [

    'Aang spends this episode learning that a monster is really a grief. Toph is running the opposite trick: she is a small polite girl on the surface and something enormous underneath, and she has been getting away with it for years.'

  '1x08': { away: true, text: [
    'The Avatar has a deadline now — the end of summer, four elements, or the war is lost. Toph has a curfew, a tutor who teaches her beginner forms she mastered before she could read, and a father who has told the household she is not to be spoken to about the outside.',
    'She lets the tutor keep his job. Watching an adult be certain he is teaching her something is, at this point, one of the few entertainments available.'

  '1x09': { away: true, text: [
    'Aang learns the water whip in three attempts this week, and it wounds his teacher, because it took Katara years alone on the ice to get there.',

  '1x10': { away: true, text: [

    'Toph has a mansion, a staff, and two living parents who love her precisely as much as they underestimate her, which is total in both directions. She has not run yet. The thing that finally does it will not be cruelty — it will be the discovery that somebody out there needs the thing she is best at.'

  '1x11': { away: true, text: [

  '1x12': { away: true, text: [
    'The storm tears up the northern coast tonight, and two boys separately confess the worst thing that ever happened to them.',
    'In the Earth Kingdom interior it is a warm dry night, and a girl standing barefoot in a courtyard can tell you where every person in the house is, which of them is asleep, which is pretending, and whose heart is going faster than it should. She has been able to do this since she was six. She has never been asked about it once.'

  '1x13': { away: true, text: [
    'A masked stranger is loose in a Fire Nation fortress tonight, doing the only version of himself that works.',
    'In Gaoling a masked stranger is loose in a wrestling ring, and it is the same trick from the other end: everyone in the province knows the Blind Bandit and nobody knows Toph Beifong, and the anonymity is not a burden, it is the whole point. She is the only person in the series wearing a mask because she enjoys it.'

  '1x14': { away: true, text: [
    'A village hands its entire future to a fortuneteller this week, and is told at the end that the future is not read, it is shaped.',
    'Toph\'s parents wrote hers years ago without consulting her: a quiet marriage into another good family, a quiet house, a companion to hold her arm, and never once being allowed past the wall. Nobody has ever suggested to her that this is negotiable.'

  '1x15': { away: true, text: [
    'Sokka spends this episode choosing between the family he was born into and the family he found.',
    'Toph has not yet been told that this is a question a person is allowed to ask. When she does ask it — and she will ask it with a note and a bison and no warning at all — she is going to do it more brutally and more completely than anyone else on this show.'

  '1x16': { away: true, text: [

  '1x17': { away: true, text: [

  '1x18': { away: true, text: [

    'In Gaoling a girl refuses to be taught. She has surpassed the master her parents pay for, and she lets him keep believing otherwise, session after session, because correcting him would mean revealing herself. Katara\'s fight is to be allowed to learn. Toph\'s is to be allowed to be what she already is.'

  '1x19': { away: true, text: [

  '1x20': { away: true, text: [

window.ATLA.pov.azula = {

  '1x01': { away: true, text: [
    'In the Fire Nation capital, the Fire Lord\'s daughter is fourteen and already better than every firebender in the palace, including the men paid to instruct her. Her fire comes out blue, which nobody had to explain to her was unusual.',

  '1x02': { away: true, text: [

  '1x03': { away: true, text: [

  '1x10': { away: true, text: [

  '1x11': { away: true, text: [

  '1x12': {
    text: [
      'She is in Book One for a handful of frames, and they are the right ones. Iroh tells the crew about the Agni Kai — the war council, the boy who spoke out of turn, the father who answered it with a duel — and the flashback shows the arena and the court watching.',
      'Iroh looks away. Azula does not. She is eleven years old, standing at the rail, watching her thirteen-year-old brother kneel and beg and then be burned by their father in front of the nation, and she is smiling. Not hiding it. Enjoying it.',

  '1x14': { away: true, text: [

  '1x19': { away: true, text: [

<script>
/* =========================================================================
   Book Two: Earth — Aang
   ========================================================================= */

window.ATLA = window.ATLA || {};
window.ATLA.pov = window.ATLA.pov || {};
window.ATLA.pov.aang = window.ATLA.pov.aang || {};

Object.assign(window.ATLA.pov.aang, {

  '2x01': {
    text: [
      'Book Two opens with him being offered a shortcut, and the shortcut is himself. General Fong has seen what came out of the harbour at the North Pole and reaches the obvious conclusion: if the Avatar can do that on demand, the war ends this month, and Aang can skip earth and fire entirely. It is exactly what Aang wants to hear — he has a comet on a calendar and three elements to go — and he agrees to try.',
      'What follows is a man throwing increasingly dangerous things at a twelve-year-old to see what triggers him, and none of it works until Fong sinks Katara into the ground and makes Aang watch her die. Then it works. The Avatar State takes the fortress apart, and inside it Roku explains the two things Aang did not know: that the state is a defence mechanism that hands him the skill of every Avatar who ever lived, and that if he is killed while he is in it, the cycle ends. Not just him. All of them, permanently.',
      'So he walks away from the shortcut in the first episode of the season, which is what the whole season is about. There is no version of this where he skips the work. He has to learn earth, from someone, properly, and he has to do it soon.'
    ],
    beat: 'Offered a way to skip the whole season, and told what it would cost to take it.'
  },

  '2x02': {
    text: [
      'A cave that only opens for people who trust love, which is a genuinely unfortunate thing to be told when you are twelve and in love with someone standing next to you. The wandering nomads are useless and delightful, the torches burn out, and Aang and Katara end up alone in the dark with a tomb and a story: Oma and Shu, two people from warring towns who built this maze so they could keep meeting.',
      'And then the conversation neither of them can quite have. Aang gets as far as suggesting they could try what the lovers did, in the abstract, hypothetically, and then loses his nerve entirely — and Katara reaches over and takes the decision away from him. The crystals light up above them and the way out appears, which is the show being about as unsubtle as it ever gets and getting away with it completely.',
      'Neither of them mentions it afterwards. Not once, not for a season and a half, and the show is completely straight-faced about that too.'
    ],
    beat: 'The kiss in the dark, and then a full season of both of them pretending it did not happen.'
  },

  '2x03': {
    text: [
      'He comes back to the one city in the world that still felt like his and it has been renamed New Ozai, its people evacuated, its king in a metal box. The last place from before the war is gone.',
      'What he does about it is the interesting part: he does not fight for it. He runs an evacuation instead, using a fake plague — pentapox, invented on the spot, spots drawn on with sucker marks — to walk an entire civilian population out through the Fire Nation lines. It is a Sokka plan executed by an Avatar, and it saves more people than any duel would have.',
      'Then he tries to trade a two-year-old for Bumi and gets a lesson from Azula about what a hostage negotiation actually is. And Bumi refuses to be rescued. He explains neutral jing — the discipline of doing nothing while you wait for the right moment — and then chooses the metal box, and tells Aang to find an earthbending teacher who listens and waits. Aang leaves without his friend and with his homework.'
    ],
    beat: 'Loses Omashu, saves everyone in it, and is told exactly what kind of teacher to look for.'
  },

  '2x04': {
    text: [
      'A swamp pulls Appa down out of the sky and separates all of them, and then starts showing them things. Katara sees her mother. Sokka sees Yue. And Aang — who has more dead people behind him than either of them, a hundred years\' worth — chases a laughing girl in an Earth Kingdom dress that he has never seen before in his life and cannot catch.',
      'Huu, who lives in the trees and bends the water out of vines, takes them to the banyan grove at the centre of it and explains the swamp: one tree, roots running for miles, everything above ground connected underneath whether it knows it or not. Time and death are illusions. The people you have lost are not somewhere else.',
      'And when Aang touches the tree he gets the answer to his vision, and it is not what anyone else got. Katara and Sokka were shown their past. Aang was shown his future — a girl he has not met yet. Two episodes later he walks into an underground wrestling ring in Gaoling and recognises her face.'
    ],
    beat: 'The others are haunted by who they lost. He gets a preview of who he is about to find.'
  },

  '2x05': {
    text: [
      'He arrives in a town that celebrates an annual festival built on burning him in effigy, which is a novel experience for someone who has spent a season being handed flowers. Chin Village has hated the Avatar for four hundred years, and they put him on trial for a murder committed by Avatar Kyoshi before his great-grandparents were born.',
      'The trial is a farce and he is convicted, and then Katara puts him in Kyoshi\'s robes and Kyoshi turns up in person to give evidence. She is enormous, unbothered, and entirely unrepentant: she split the peninsula off the mainland to protect her people from Chin the Conqueror, and Chin died because he stood on the edge of a collapsing cliff and refused to move. Technically not murder. Morally, she does not appear to care much either way.',
      'It is the first time Aang meets a past life who is nothing like him — Roku counselled and warned; Kyoshi solved the problem and went home. He is being shown, gently, that the job has been done other ways.'
    ],

  '2x06': {
    text: [
      'The girl from the swamp vision is real, she is in an underground wrestling ring in Gaoling under the name The Blind Bandit, and she is the best earthbender he has ever seen. She also throws him out of an arena within about four seconds of him trying to talk to her.',
      'Everything about her is the thing he is worst at. Earthbending is not evasion, and Toph does not move — she plants herself, waits, listens to the ground, and lets people break themselves against her. It is exactly what Bumi told him to look for, delivered by a twelve-year-old who has no interest in the job and a father who will not let her out of the garden.',
      'When Xin Fu takes them both for ransom and Toph\'s father hears her father describe her, out loud, as helpless — that is what does it. She takes the entire Earth Rumble roster apart single-handed in front of him, and she is still not allowed to leave, and she leaves anyway. She catches them up on the road. Aang has a teacher, and she is going to be the worst one available.'

  '2x07': { away: true, text: [

  '2x08': {
    text: [
      'Three days without sleep, a machine that never stops, and the discovery that the reason they cannot shake it is Appa — the shedding is leaving a trail of fur across the entire province. So Aang sends everyone away and stands in an abandoned town by himself to draw Azula off, which is the same instinct he had on Kyoshi Island and at the North Pole and it is starting to look like a habit.',
      'What he gets instead is the strangest scene in Book Two. Azula in the ruins of Tu Zin, and then Zuko, and the two of them fighting each other while he watches — and then his friends arriving, and then Iroh, until there are six benders in a semicircle around one girl who is out of options.',
      'And then she shoots the old man and is gone in the confusion, and the standoff dissolves into Zuko screaming at the only people offering to help. Aang offers anyway. Katara offers to heal Iroh, and Zuko drives them off with fire, and Aang leaves without pressing it — which after a year of asking Zuko whether they could be friends is the first time he takes no for an answer.'

    beat: 'Six benders, one standoff, and the first time his standing offer to Zuko is refused for good.'

  '2x09': {
    text: [

      'What finally does it is Sokka. A saber-tooth moose lion comes for him, and Aang stops thinking about the exercise and plants his feet and pushes, and the rock goes. That is the whole lesson: he can do it when it is for somebody else and there is no time to consider running.',
      'It is a small moment and it is his third element, and he gets it in the ninth episode of the season, which leaves him fire — and he has not touched fire since he took the skin off Katara\'s hands.'

  '2x10': {
    text: [
      'A library buried in the desert with an owl spirit in it who has met humans before and did not enjoy it. Wan Shi Tong lets them in on the explicit condition that they are not there to use knowledge as a weapon, and every single one of them is lying to him, and Aang knows it.',
      'He gets a look at what a hundred years of accumulated human knowledge is worth, and he gets Sokka\'s discovery — the burnt scrap and the planetarium and the date of a solar eclipse — and then he has to run for it while a spirit sinks the whole building into the sand out of contempt.',
      'And he comes up into daylight to find Appa gone. Not lost. Taken. The library is instantly irrelevant, the eclipse is instantly irrelevant, and the last living connection to the world he was born into is somewhere out in the sand in a chain.'

  '2x11': {
    text: [
      'The worst version of him, and the show does not soften it. He turns on Toph first — she was holding a library up with her body and could not hold that too, and he tells her she should have stopped them anyway. Then he stops talking to anyone. He glides ahead in silence, comes back, says nothing, and everyone lets him because nobody knows what to say to it.',
      'When they find the sandbenders and he learns Appa was muzzled and sold, he goes into the Avatar State on purpose — or close enough — and takes the entire camp apart, ripping their sand-sailers into a vortex with a tribe of people cowering inside it. This is not the North Pole; there is no spirit riding him and no invasion to stop. It is a twelve-year-old with the power to level a city being angrier than he has ever been.',
      'Katara is the only one who does not run. She walks into it and holds onto him until it stops. That is the second time she has done that, and both times nobody else was going to.'

  '2x12': {
    text: [

      'The Serpent\'s Pass is a cliff over a lake with something enormous in it, walked by refugees who have no other route, and he crosses it in the same glassy calm. Then Ying goes into labour on the far side, and Katara delivers a girl, and the parents call her Hope.',
      'And that is what breaks it. He looks at a baby born on the worst road in the Earth Kingdom and cries, and says out loud that he has been having a hard time and this has made him hopeful again — which is the first honest sentence out of him in three episodes. Then they crest the last ridge and there is a Fire Nation drill the size of a town grinding at the wall of Ba Sing Se, and Appa has to wait again.'

  '2x13': {
    text: [
      'A drill three hundred feet across is chewing through a wall that has never been breached, and Aang spends the episode doing something he is not used to: following someone else\'s plan in detail. Sokka works out that it cannot be stopped from outside, so they go in through the slurry pipes, and Aang\'s job is to weaken specific braces in a specific order.',

  '2x14': {
    text: [

      'Aang cannot get to the Earth King, cannot ask about Appa, cannot mention an eclipse. He crashes a palace party in disguise and is intercepted by men in stone gloves, and then Long Feng explains the arrangement over tea: the king is a figurehead, the Dai Li run the city, and the peace inside the walls is maintained by making sure nobody knows there is anything outside them. Aang can stay and look for his bison, or he can talk about the war, and not both.',

  '2x16': { away: true, text: [
    'This one belongs entirely to Appa, and Aang is not in it — which is the point, because for a month he was not there. The month covers sandbenders, a muzzle, a circus trainer with a whip, a fight with a boar-q-pine, and a bison so frightened of fire that he flies from a campfire.',
    'The Kyoshi Warriors take the quills out and the shackles off, and Suki scares him into the air to save him from Azula. He gets as far as the Eastern Air Temple, where a guru who has been waiting for both of them since before Aang was born tells him to go to Ba Sing Se. And in Ba Sing Se, Long Feng blows a bison whistle in the dark. Everything Aang has been searching for has been under his feet for weeks.'

  '2x17': {
    text: [
      'He puts posters up all over the city, which is against the rules, and it works — Jet finds them. Jet, who tried to drown a valley, now insisting he is reformed and has seen Zuko and Iroh in a tea shop, and Toph flatly telling everyone the boy believes every word he is saying and is still lying, because someone has been inside his head.',

  '2x18': {

      'Having been refused by every proper channel, he simply flies a ten-ton bison through the palace and puts the war in front of the Earth King himself — and the extraordinary thing is that it works. Not because of the invasion plan, but because Appa\'s bite marks fit the wound on Long Feng\'s leg, which is the least dignified way an empire has ever been exposed.',
      'The king is shown his own wall with a Fire Nation drill buried in it, Long Feng is arrested by his own secret police, and for one episode the entire war effort clicks into place: the Earth Kingdom army, the date of the eclipse, Hakoda\'s fleet, an invasion plan with a real chance.',

  '2x19': {

  '2x20': {

Object.assign(window.ATLA.pov.katara, {

  '2x01': {
    text: [
      'She starts the season with two gifts from the North Pole: waterbending scrolls, and a small vial of water from the Spirit Oasis that Pakku tells her has unique properties and should be kept for something that matters. She wears it round her neck for twenty episodes. It is the single most important object in Book Two and it spends almost all of the season doing nothing.',
      'The rest of the episode is her arguing against General Fong, correctly, from the start — that using Aang as an artillery piece is not a plan, that the Avatar State is not a switch, and that a boy who cannot control it should not be provoked into it. Nobody listens, because she is a fourteen-year-old girl in a room of officers.',
      'And then Fong sinks her into the ground to fake her death, and it works, and Aang levels the base over her. She is the trigger. Not by choice, not for the first time, and not for the last: the show is establishing very early that Aang\'s worst loss of control has one specific shape.'
    ],
    beat: 'Given the vial that saves everything, and shown exactly what happens to Aang if she dies.'
  },

  '2x02': {
    text: [
      'She is the sensible one for most of an episode about nomads, and then the torches go out and she is in a tomb in the dark with Aang and a love story on the wall about two people who built a labyrinth so they could keep seeing each other.',
      'The conversation is one of the best-written awkward moments in the show. Aang gets as far as the theory of it and then talks himself out of it, and Katara — who has spent a season and a half being everyone\'s adult — makes the decision herself and kisses him.',
      'Then the crystals light, they walk out, and she never mentions it again. There is a version of this character who is coy about that. Katara is not coy; she is busy, and there is a war on, and she has decided not to look at the thing she just did. It stays unlooked-at for a season and a half.'
    ],
    beat: 'Makes the decision Aang cannot, and then declines to think about it for eighteen episodes.'
  },

  '2x03': {
    text: [
      'She invents pentapox. That is a genuinely underrated Katara move: presented with an occupied city full of civilians who cannot fight and cannot leave, she and Sokka work out that Fire Nation soldiers will open a gate for a plague faster than they will for an army, and she sells it — spots, moaning, the lot.',
      'The rest of the episode is her being handed a baby and being unreasonably good at it, and being the one who says out loud that trading a two-year-old for a king is not a thing they are actually going to do, even to get Bumi.',
      'It is also the first proper look at what Azula does to the group. Ty Lee blocks her chi and she drops, mid-bend, unable to move — the first person in the series to switch a bender off, and it happens to the one whose whole identity is her bending.'
    ],
    beat: 'Talks a whole city out through the front gate, and meets the girl who can turn her off.'
  },

  '2x04': {
    text: [
      'The swamp shows her her mother. Not a memory — a figure standing in the water in the dress, and Katara goes to her, and it is a stump.',
      'She is the one who insists afterwards that it was nothing, that swamps make fog and grief makes shapes, and she says it a little too quickly. Of the three visions hers is the cruellest, because Sokka\'s Yue speaks to him and Aang\'s girl is a promise, and Katara\'s is simply her mother, silent, and then not there.',
      'Huu\'s explanation — one tree, roots under everything, time and death are illusions — is aimed squarely at her, and she does not accept it and does not argue with it either. The show is planting something it will not collect until Book Three, when she finds the man who actually did it.'
    ],
    beat: 'Given a glimpse of her mother, and refuses to be comforted by what the swamp says about it.'
  },

  '2x05': {
    text: [
      'A murder trial with no evidence and no defence, so Katara conducts an investigation. She and Sokka go to Kyoshi Island, examine the one piece of physical evidence, and establish that the footprint at the scene is far too small to be Kyoshi\'s. It is a real, clean piece of detective work and the town ignores it, because they have wanted the Avatar to be guilty for four hundred years.',
      'So she changes tactic and does the thing that actually works, which is theatre: she puts Aang in Kyoshi\'s robes and fan and makeup and lets the woman speak for herself. It is the same instinct as the clouds over Makapu in Book One — if people will only believe one kind of thing, give them that kind of thing.',
      'And then Kyoshi cheerfully confirms she did it anyway, which nobody planned for.'
    ],
    beat: 'Wins the case on evidence, loses the room, and wins it back with a costume.'
  },

  '2x06': {
    text: [
      'She spends the episode watching Aang chase a girl around Gaoling and being the one who reads the situation properly: Toph is not difficult, Toph is trapped, and the wrestling ring is not rebellion for its own sake, it is the only room in the province where she is allowed to be what she is.',
      'When Toph arrives on the road at the end, Katara is delighted — a second girl, finally, after a season and a half of being the only one — and she is going to spend the next several episodes discovering that Toph is not remotely interested in being anyone\'s sister.'

    beat: 'Gets the second girl she has wanted since episode one, and it is not going to go how she hopes.'
  },

  '2x07': { away: true, text: [
    'The one episode of the entire series with no Team Avatar in it. Katara is on the road somewhere with a new travelling companion who does not fold her bedroll, does not thank anyone, and does not want a mother.',
    'The episode is instead about the boy who has been hunting them, alone, without a name, being taken in by a farming family and then thrown out by them — which is the exact fate Katara spends this season making sure never happens to anyone she is responsible for.'
  ]},

  '2x08': {
    text: [
      'The Katara-and-Toph fight, and the show is scrupulously fair about it. Katara asks for help with the camp; Toph points out that she carries her own weight and does not need anyone to make her bed; Katara escalates because she has been the mother of this group since she was fourteen and has never once been asked whether she wanted the job. Both of them are right and both of them are being unbearable, and three days without sleep is doing the rest.',
      'Then the machine catches them at Tu Zin, and she is in a six-way standoff around Azula. And when Azula shoots Iroh and vanishes, Katara — who has every reason not to — steps forward and offers to heal the old man. It is not a strategic decision. It is the reflex.',
      'Zuko screams at her to get away from them and throws fire, and she goes. It is the first time in the series she offers help and is refused.'
    ],
    beat: 'Offers to heal her enemy without being asked, and is driven off for it.'
  },

  '2x09': {
    text: [
      'Mostly on the sidelines of Toph\'s teaching, and she makes exactly one intervention that turns out to be the wrong tool: she suggests positive reinforcement instead of contempt, and it does not work, because Aang\'s problem is not confidence, it is instinct.',
      'It is a small, honest note about her. Her method — encouragement, patience, staying — has worked on Aang every single time so far, and this is the first thing it does not solve. Earthbending needed Toph\'s method and an emergency, and Katara had to watch it not be her.'
    ],
    beat: 'Her method finally meets a problem it cannot fix, and she has to stand back.'
  },

  '2x10': {
    text: [
      'She is the one who names the lie at the door. Wan Shi Tong lets them in on the condition that they are not here to use knowledge as a weapon, and every one of them agrees, and Katara knows what they are actually doing there. When the owl works it out and starts sinking the building, she is not surprised.',
      'Her contribution in the library is holding the group together while everyone else chases a discovery, which is unglamorous and is exactly what she does. And then she comes up out of the sand into the worst news of the season.'
    ],
    beat: 'The only one who is honest with herself about what they came to the library to do.'
  },

  '2x11': {
    text: [
      'The best episode she has in the first half of the season, and it is entirely made of unrewarded competence. Aang has stopped speaking. Toph cannot see. Sokka has drunk something out of a cactus and is having conversations with the sky. So Katara rations the water, navigates by the stars, keeps four people walking through a desert, and does not get thanked for a single part of it.',
      'She also does something quietly extraordinary with Toph — takes the library scroll from her, because Toph cannot read it and cannot say so, without making it a thing.',
      'And at the end, when Aang goes into the Avatar State over the sandbenders and everyone else runs, she walks into it and holds onto him until it stops. It is the second time she has done that. Both times she is the only person in the world who would.'
    ],
    beat: 'Carries four people across a desert and then walks into the Avatar State to switch it off.'
  },

  '2x12': {
    text: [
      'Aang announces he has let go of Appa and feels nothing, and Katara does not believe a word of it and cannot get through. That is new: she has always been able to reach him, and this time he has built something she cannot argue with, because he is agreeing with everything she says in a completely serene voice.',
      'She is also carrying the refugees on the Serpent\'s Pass more or less personally — parting a flooded stretch of the path to walk them through it, holding the line against the serpent — and then delivering a baby on the far side of it with no preparation at all.',
      'And the baby is what does what she could not. Aang looks at Hope and finally cries, and Katara gets him back. She did not fix it. She kept everyone alive until something else did, which is most of what this season asks of her.'
    ],
    beat: 'Cannot reach him for the first time, and keeps everyone alive until something else does.'
  },

  '2x13': {
    text: [
      'She is inside the drill with Aang doing precision work on structural braces, which is not what waterbending has been for up to now, and then she and Sokka escape through a slurry pipeline and work out how to use the machine\'s own pressure against it.',
      'The good bit is small and easy to miss: she is the one who plugs the drain. The whole plan hinges on the slurry having nowhere to go, and it is Katara holding it — a girl who could not lift a puddle two seasons ago, standing in a pipe holding back several tons of rock and water so that a siege engine tears itself open.'
    ],
    beat: 'Her bending becomes engineering, and it brings down a machine the size of a town.'
  },

  '2x14': {
    text: [
      'She is the one who works out that Joo Dee is not a person so much as a role, and she is the one who pushes at the party — putting on the green dress, walking into the palace, getting closer to the Earth King than anyone else manages.',
      'And then the Dai Li, and Long Feng, and the very polite explanation of the terms. What lands hardest on her is not the threat; it is watching an entire city of people be kept safe by being kept ignorant, and being told that this is the kindness. She has spent two seasons telling people the truth about the war on the assumption that the truth is what frees them.'
    ],
    beat: 'Gets furthest into the palace, and hits a wall made of manners.'
  },

  '2x15': {
    text: [
      'Her tale is the spa with Toph, and it is doing more than it looks like. Katara drags her to a day of being fussed over, which Toph agrees to out of something between boredom and curiosity, and it is the first thing the two of them have done together that is not a fight.',
      'Then some girls on the bridge laugh at Toph\'s feet and her clothes and her eyes, and Katara is the one who goes still — and Toph slides the bridge out from under them, and they laugh about it in the water. It is the whole friendship in ninety seconds: Katara offers the thing she has (softness, attention, being looked after), Toph accepts about ten percent of it, and they find the middle in a shared act of petty violence.'
    ],
    beat: 'Finds the actual terms of her friendship with Toph, and they are not sisterly.'
  },

  '2x16': { away: true, text: [
    'The month told from Appa\'s side, with none of them in it. Katara spent that month watching Aang search and keeping the group functional through a desert, a serpent, a siege engine and a city of secrets.',
    'The episode\'s cruelty is structural: while she was holding everyone together above ground, Appa was already under it, taken by Long Feng within a day of reaching the city.'
  ]},

  '2x17': {
    text: [
      'Jet again, and she does not forgive him. She is cold to him in a way she is to almost nobody, and it is completely earned — she has already had this argument once, in a forest, and it ended with her freezing him to a tree.',
      'Then Toph says he is telling the truth and lying at the same time, and Katara has to reorganise her whole reaction around the fact that the person in front of her has been taken apart and rebuilt by the government of the city they are standing in.',
      'She gets Appa back with the rest of them, and she watches Jet die under a rock in a stone room, and she does not get to resolve any of it with him. The last thing between them is her having been right.'
    ],
    beat: 'Never forgives him, is never given the chance to, and has to live with both.'
  },

  '2x18': {
    text: [
      'A very good hour for her. She is the one who spots the Fire Nation insignia on the wreck of the drill when Long Feng tries to pass it off as a construction project, which is the precise moment his authority collapses and the Earth King turns.',
      'And then, when the group splits, she is the one who volunteers to stay — to advise a king who has just found out there is a war on, in a city whose secret police she does not trust, alone.',
      'It is the most sensible allocation of four people available and it is also how they end up scattered across a continent when Azula walks in the front door.'
    ],
    beat: 'Wins the room, and then volunteers for the post that leaves her alone in it.'
  },

  '2x19': {
    text: [
      'She recognises Zuko in a tea shop and runs to warn the Earth King, and does everything correctly and quickly and it does not matter at all, because the Kyoshi Warriors in the throne room are Azula, Mai and Ty Lee, and she has walked directly to the one place they were waiting.',
      'Ty Lee drops her in about two seconds. That is the second time this season a girl with no bending at all has switched the best waterbender of her generation off like a lamp.',
      'The last shot of her is on the floor of a room she thought was safe, having been the only one of the four who stayed.'
    ],
    beat: 'Does everything right, at speed, and walks straight into the trap because of it.'
  },

  '2x01': { away: true, text: [

  '2x03': { away: true, text: [

  '2x04': { away: true, text: [

  '2x05': { away: true, text: [
    'Her last episode outside the story. A town spends four hundred years hating the Avatar for something the Avatar did not do, and only changes its mind when Kyoshi turns up in person and tells them what actually happened.',

  '2x06': {
    text: [
      'Her introduction is a fight and it is the correct choice. She comes out under a false name in front of a paying crowd, and she does not throw a single rock until the man in front of her has committed his weight — and then the arena does the rest. She beats the entire Earth Rumble roster including a champion twice her height, and she is twelve.',
      'Then the episode shows you the other room. Toph Beifong, in silk, being led by the elbow, being spoken over, being described to guests by a father who genuinely loves her and has genuinely decided that she is a small helpless thing that must be kept indoors. She lets him. She has been letting him for years, because the alternative is a fight she does not yet have a reason to win.',

      'Every single thing about her is set up in one episode: the ground as sight, the immovability, the deliberate rudeness, the runaway, and the fact that the cage was built out of love, which is what makes it hard to leave.'

    beat: 'The best earthbender alive stops pretending, in front of her father, and leaves that night.'

    'No Team Avatar this week. Toph is two days into travelling with three people who keep trying to include her in things, and is being briskly unpleasant about it.',

  '2x08': {
    text: [

    text: [

  '2x08': {

  '2x16': { away: true, text: [

  '2x17': {

  '2x01': {
    text: [
      'He is the one who spots the trap. Azula\'s letter says their father has changed his mind, and Zuko is already packing, and Iroh watches the ship\'s captain make one small error of protocol and understands instantly that they are being collected, not welcomed.',
      'He tries to get Zuko out without a fight and does not manage it, and the two of them go over the side into the Earth Kingdom with nothing.',

    beat: 'Gives up his own standing so that his nephew is not the only one who has lost it.'
  },

  '2x02': {
    text: [
      'He eats the white jade bush. A sixty-something master of the most refined tea culture in the world identifies a plant incorrectly, brews it, drinks it, and swells up like a fruit — and the episode plays it as farce and then does something with it.',
      'Because Zuko has to go and find a healer, in the Earth Kingdom, which means being helped by the people his family has spent a century burning. Song feeds them and shows Zuko the burn on her leg. And Iroh, over dinner, is charming to a woman whose village his nation destroyed, and it is not a performance.',
      'Then Zuko steals their ostrich horse, and Iroh names it out loud — that this is not something they get to do — and lets his nephew ride off with it anyway, because he has learned that lecturing does not work and the stealing is going to have to become intolerable to Zuko from the inside.'

    beat: 'Poisons himself with tea, and uses the fallout to show Zuko exactly who his war hurts.'
  },

  '2x03': { away: true, text: [
    'Off-screen, while Azula takes Omashu without spending a soldier and adds two friends to her hunt.',

  '2x04': { away: true, text: [
    'Off-screen, while a waterbender in a swamp explains that everything is one organism and that time and death are illusions, and that the people you have lost are not somewhere else.',

  '2x05': { away: true, text: [
    'Off-screen. A town this week convicts an Avatar of a killing and then has to be shown, by the dead woman herself, what actually happened.',

  '2x06': { away: true, text: [
    'Off-screen. In Gaoling a girl leaves a house built out of love and fear, because a stranger has offered her something to do that only she can do.',

  '2x07': {
    text: [
      'He does not appear in the present, and he is all over the episode. The flashbacks are where Iroh finally gets a past.',
      'He was at Ba Sing Se. Six hundred days, the greatest siege in the history of the war, and it was going to work — and his only son Lu Ten was killed at the wall, and Iroh broke, and the army came home. That is the entire explanation for the man we met sleeping in a chair in episode one, and the show has waited twenty-seven episodes to hand it over.',
      'And the piece that says the most about him is small: he sent Zuko a knife from the front, with "never give up without a fight" carved into it, in the middle of the campaign that killed his son. He was thinking about his brother\'s child while he was losing his own.',
      'Meanwhile his brother used Lu Ten\'s death as an argument for taking Iroh\'s birthright, and Azulon\'s answer was to order Ozai to know a father\'s pain by killing his own son — and Ursa disappeared to stop it. Iroh came back from the wall to find his father dead, his brother on the throne, his sister-in-law gone, and his nephew alive because his mother traded herself for him.'

  '2x08': {
    text: [

      'And then Tu Zin, and six benders in a ring around his niece, and Iroh in that circle standing against his own family in the open.',
      'Azula picks her exit and shoots him in the chest with lightning — deliberately, at the person most likely to make her hesitate, because she calculated that it would break the circle, and it does. Iroh goes down. And Zuko drives away the girl offering to heal him, and Iroh, half-conscious, has to be carried off by a nephew who has just refused the only help on offer.'

  '2x09': {
    text: [

      'So he teaches him redirection instead, which he invented by watching waterbenders. He says that out loud: the greatest firebender of his generation learned the technique that has kept his nephew alive twice by studying the enemy\'s art and admitting it was better. In a nation built on the proposition that fire is superior, that is close to treason, and he teaches it to a boy over a rock.',
      'And then Zuko asks him to fire real lightning at him, and Iroh refuses — flatly, without a lesson attached. He will not hurt him even for training, even when asked. Zuko rides off into a storm to make the sky do it instead, and Iroh lets him go, and is there when he comes back.'
    ],
    beat: 'Teaches him the enemy\'s idea, and refuses to be the one who strikes him.'

  '2x10': { away: true, text: [
    'Off-screen, while a boy finds a date in a library that could end the war in eight minutes.',

  '2x11': { away: true, text: [

  '2x12': {

  '2x13': { away: true, text: [

  '2x14': {
    text: [
      'He is extremely good at working in a tea shop, which surprises nobody who has been paying attention. He improves the tea, charms the customers, gets promoted, and is visibly, uncomplicatedly happy for the first time in the series.',

  '2x15': {

      'And then he climbs a hill above the city with the flowers, and sets out a small shrine, and sings "Leaves from the Vine" to his son — badly, and crying — and says that he thinks about him every day, and that he would have been a great man. Lu Ten. Happy birthday.',

  '2x16': { away: true, text: [

    'Everyone in this story is converging on the same city without knowing it, and Iroh has been pouring tea in it the whole time.'

  '2x17': {
    text: [
      'The scene the whole series has been building to, and it is two questions.',
      'Zuko has the Blue Spirit mask on and a plan to steal the bison, and Iroh follows him down to Lake Laogai and refuses to let it happen on autopilot. He does not tell him it is wrong. He does not invoke honour, or the Fire Nation, or his father. He asks: who are you, and what do you want. And when Zuko gives the rehearsed answer — his destiny, capturing the Avatar, going home — Iroh says no, and asks again, because that is what his father wants, and it is not the same question.',

  '2x18': {
    text: [

  '2x20': {
    text: [
      'He comes down into the catacombs with the Avatar, which is a sentence that would have been unimaginable two seasons ago, and he arrives to find his nephew standing between his niece and the boy he spent three years hunting.',
      'And he does not order him, or shame him, or invoke anything. He tells him he is proud of him, that he knows he has struggled, and that this is the moment — look inside your own heart and decide who you are. He gives Zuko a completely free choice, which is the most dangerous and most respectful thing he could possibly do, and it is the last card he has.',
      'Zuko chooses Azula. Iroh has to watch it, and then hold off a room full of Dai Li so the children can get out, and is taken and put in chains in the city he besieged, by the sister of the boy he raised.',
      'He does not blame him. That is the part that hurts. The last thing he does in Book Two is buy Aang and Katara time, and the last thing we see of him is a man in a cell who gave away his nation, his rank, his freedom and his best day for a nephew who chose someone else — and who will, in a season, come back for him.'
    ],
    beat: 'Gives Zuko a completely free choice, loses, and never once blames him for it.'
  }
});

</script>
<script>
/* =========================================================================
   Book Two: Earth — Azula
   ========================================================================= */

window.ATLA = window.ATLA || {};
window.ATLA.pov = window.ATLA.pov || {};
window.ATLA.pov.azula = window.ATLA.pov.azula || {};

Object.assign(window.ATLA.pov.azula, {

  '2x01': {
    text: [
      'Her first full appearance, and the show introduces her by having her be better than everyone in the room without raising her voice. She arrives in a warship with a letter saying their father has forgiven Zuko and wants him home, and it is a lie, and it is a very good one — because it is the exact lie her brother has been waiting three years to be told, and she knows that about him.',
      'The tell is one word. She calls them prisoners in front of her own captain, and Iroh catches it, and the trap collapses. Watch her face when it does: no anger, no panic. She simply moves to the next option.',
      'She loses them. And this is the important part — the first thing we see her do is fail, and she is entirely unbothered by failing, because she has already worked out that her brother is now loose in the Earth Kingdom with no money, no ship and one old man, and that time is on her side. She has been given a hunt. She has all season.'
    ],
    beat: 'Baits her brother with the one sentence he cannot refuse, and is unmoved when it fails.'
  },

  '2x02': { away: true, text: [
    'Off-screen. In a cave this week, two children get out of a labyrinth because they trust each other, which is the stated mechanism of the door.',
    'Azula has never once relied on that and is about to build a team on the opposite principle. Both approaches work. Only one of them holds up when it is tested.'
  ]},

  '2x03': {
    text: [
      'She takes Omashu without a battle. There is no siege, no fleet, no burning: the city is already hers when the episode starts, the king is in a box, and she has renamed the place New Ozai, which tells you precisely who she is performing for.',
      'And then she goes and collects the two people who make her genuinely unbeatable, and the recruitment is a character study on its own. Mai she simply asks, and Mai comes because she is bored to the point of pain and Azula is the most interesting thing available. Ty Lee says no — she has run away to the circus and she is happy there — so Azula sits in the front row and sets the safety net on fire while Ty Lee is on the wire, and then asks again. Ty Lee says yes.',
      'Those are the two methods. Take what someone wants, or remove what they have. She uses both in one afternoon on her two closest friends and does not consider either of them a betrayal, because in her model that is what friends are for.',
      'And she calls off the hostage trade for Bumi, because a two-year-old is not worth a great earthbender. She is right on the arithmetic. She is always right on the arithmetic.'
    ],
    beat: 'Assembles her team by taking one friend\'s freedom and burning the other\'s safety net.'
  },

  '2x04': { away: true, text: [
    'Off-screen. A swamp shows three people the person they have lost most, and tells them that everything is connected underground whether it knows it or not.',
    'Azula has lost a mother and does not describe it as a loss. The connection under everything, in her case, runs to a father, and it is the only root she has, and in two seasons it is going to be cut.'
  ]},

  '2x05': { away: true, text: [
    'Off-screen, while a town puts the Avatar on trial for something a previous Avatar did.',
    'Azula would find the Kyoshi verdict entirely reasonable — Chin refused to move and the cliff went, and that is his problem. What she would not understand is why anybody needed four hundred years and a trial to say so.'
  ]},

  '2x06': { away: true, text: [
    'Off-screen. In Gaoling a girl leaves a family that loves her and has decided who she is, in order to go and be useful to strangers.',
    'Azula has a family that has decided who she is too, and she agrees with the assessment, and has never once wanted to leave. That is the whole difference, and it is why one of them ends Book Three on a mountain with friends and the other ends it screaming at nobody.'
  ]},

  '2x07': {
    text: [
      'She is nine years old in the flashbacks and she is already the finished article, which is the most frightening thing about her.',
      'She performs firebending forms perfectly and is praised. She tells Zuko, casually, that their grandfather has ordered their father to kill him, and it happens to be true, and she says it the way another child would share a rumour. She burns a doll. She cartwheels while their mother is being told her son must die. And she gets the line the whole show hangs on her: Zuko has to remind himself, out loud, that Azula always lies — not to reassure himself, but as a survival procedure.',
      'And there is a flicker in it that the series will not collect for two more seasons. Ursa is warm to Zuko and wary of her daughter, and Azula sees it every day and says — accurately — that their mother thinks she is a monster. She is not wrong. She is nine.',
      'This is her only appearance in the episode and she does more damage in it than she does with a fleet.'
    ],
    beat: 'Nine years old, already finished, and already told by her own mother what she is.'
  },

  '2x08': {
    text: [
      'The whole episode is her method. She does not attack the Avatar; she runs him. A machine with no stop in it, three shifts of crew, and a target that has to sleep — she works out that a group can be beaten by exhaustion faster than by force, and she is right, and by the third day they are fighting each other instead of her.',
      'Then Tu Zin, and she gets the fight she wanted with her brother, and then Aang, and then all of them, until she is standing alone in a semicircle of six people who can each kill her.',
      'And she does the coldest thing in Book Two. She surrenders — hands up, verbally, out loud — and while everyone\'s guard drops by a fraction she puts lightning through the one person in the circle nobody expects her to shoot: her uncle. Not the Avatar. Not the tactical threat. The person whose fall will make the most people move at once.',
      'It works perfectly. She is gone before Iroh hits the ground. It is the moment the series stops treating her as Zuko\'s sister and starts treating her as the antagonist.'
    ],
    beat: 'Fakes a surrender and shoots her uncle, because he was the shot that made everyone else move.'
  },

  '2x09': { away: true, text: [
    'Off-screen, while her uncle recovers from her lightning by teaching her brother how to survive it.',
    'She has never had to be taught that. She generates lightning because there is no conflict in her — which is the technique\'s actual requirement, and it is also, stated plainly, a description of someone with nothing pulling in the other direction. The show gives her the most beautiful power in the world and tells you what it costs to have it.'
  ]},

  '2x10': { away: true, text: [
    'Off-screen, while a boy with no bending finds the date of a solar eclipse in a library under the desert.',
    'That date is the single greatest threat to her family in a century, and nobody in the Fire Nation will know it exists for another season. When they find out, it will be from her brother.'
  ]},

  '2x11': { away: true, text: [
    'Off-screen. In the desert this week the Avatar loses control completely and takes a camp apart in grief.',
    'This is the thing Azula never does and never will. Her worst defeats produce recalculation, not rage — which is why the moment in Book Three when she finally does lose control lands so hard.'
  ]},

  '2x12': { away: true, text: [
    'Off-screen, while refugees walk a cliff path to reach the one city her nation has never taken.',
    'She is already looking at that city. Her brother is on a ferry to it, her father\'s drill is at its wall, and in eight episodes she will be inside it wearing someone else\'s uniform.'
  ]},

  '2x13': {
    text: [
      'She is standing on a machine three hundred feet across that is grinding through the greatest wall on earth, and she is bored by it. Her contribution is not the drill; her contribution is Mai and Ty Lee, deployed precisely — sent to strip the earthbenders off the wall while the engineers do the boring part.',
      'And she gets a genuine look at Aang for the first time, on top of the drill, and the fight is instructive: she is faster and more accurate, and the reason she does not win is that the machine under her feet is coming apart because a boy with a boomerang understood its plumbing.',
      'That is the pattern for her whole season. She is never beaten by strength. Everything that actually costs her is somebody being cleverer in a direction she did not think was a direction. She will remember. Her next attempt on Ba Sing Se does not involve a machine at all.'
    ],
    beat: 'Loses her father\'s siege engine to a boy with a diagram, and draws the correct conclusion.'
  },

  '2x14': { away: true, text: [
    'Off-screen, while the Avatar discovers that Ba Sing Se is run by a secret police force and a Grand Secretariat who keeps the war out of the city by keeping it out of people\'s mouths.',
    'Long Feng has spent decades building an apparatus for making people believe whatever the state requires. Azula is four episodes from arriving, looking at it, and taking it off him — because it is exactly the machine she would have built, already assembled, waiting.'
  ]},

  '2x15': { away: true, text: [
    'Six small stories about people in a city having a day: a spa, a picnic, a zoo, a poetry duel, a first date, an old man singing to his dead son.',
    'She has no tale, and she could not have one. Every vignette in this episode is somebody being loved by someone, briefly, for no strategic reason. There is no version of it with Azula in it, and the absence is the most accurate thing the episode could say about her.'
  ]},

  '2x16': {
    text: [
      'A brief appearance in the bison\'s episode, and a revealing one. The Kyoshi Warriors have found Appa half-dead and have been nursing him — pulling quills out, taking the shackles off — and Azula, Mai and Ty Lee arrive and attack them.',
      'She loses the bison. Suki scares him into the air deliberately, and takes the fight herself so he can get away.',
      'But she takes something better and does not tell anyone yet: the uniforms, and the knowledge that a group of Kyoshi Warriors can walk into an Earth Kingdom palace and be welcomed. Two episodes later she is in the throne room in green face paint. Everything Azula does in Book Two is her losing a fight and picking up something more useful than the thing she came for.'
    ],
    beat: 'Loses the bison, and leaves with the uniforms that take Ba Sing Se.'
  },

  '2x17': { away: true, text: [
    'Off-screen, while her brother stands in front of an open cage with a mask on and lets the Avatar\'s bison go.',
    'That is the one moment in the whole series where Zuko was not going to be recoverable by her. He gave up the thing that would have bought him his way home, on his own, with nobody watching — and then had no answer for what he wanted instead, and Azula is very good at supplying answers to people with a space where one should be.'
  ]},

  '2x18': {
    text: [
      'She spends the episode not being in it, and arrives in the last thirty seconds through the front door.',
      'The Earth King has just been told there is a war on. Long Feng is in chains. The Avatar has been believed, the army is mobilising, the invasion has a date. Everything in Book Two has finally gone right.',
      'And then the Kyoshi Warriors arrive to protect the palace, and they are welcomed, and the last shot is the three of them in green with their faces painted, and Azula smiling at the king. No fleet, no drill, no siege. She walks into the greatest fortress in the world because somebody opened the door for her.',
      'It is the exact lesson from the drill, applied. She got beaten by cleverness once and simply became clever.'
    ],
    beat: 'Takes the unbreakable city by being invited in.'
  },

  '2x19': {
    text: [
      'Inside the palace, and this is her best work in the series. She does not seize anything. She finds Long Feng — a man who has just been arrested, humiliated, and stripped of a city he ran for decades — and offers him an alliance to take it back, and he accepts, because she is offering him the thing he wants.',
      'And she knows, while she is offering it, that she is going to keep the Dai Li and discard him, because the Dai Li are the actual asset and Long Feng is only the man who currently holds them. She spends the episode being their partner and quietly becoming the person they would rather follow.',
      'Katara recognises the disguise and runs to warn the king and runs directly into the throne room, and Ty Lee drops her in two seconds, and that is that. Everything Azula touches this episode goes exactly as planned, which has not been true for her all season and will not be true again for very long.'
    ],
    beat: 'Borrows Long Feng\'s coup, and starts stealing his secret police while she is inside it.'
  },

  '2x20': {
    text: [
      'She wins everything. In one episode she takes the Dai Li off Long Feng permanently, takes the palace, takes Ba Sing Se — the city her uncle failed to take with an army and six hundred days — kills the Avatar, and gets her brother back on her side. It is the most complete victory anyone achieves in the entire series and it belongs to a fourteen-year-old.',
      'The way she gets Zuko is the best writing she is given. She does not threaten him. She offers, calmly and with apparent generosity, to tell their father that Zuko was the one who killed the Avatar — his honour, his home, his father\'s love, handed over as a gift from a sister who says she needs him. She has read him perfectly. It is the only offer that could have worked and she makes it in about four sentences.',
      'And then Aang gets into the Avatar State, and Azula does the single most consequential thing in the series: she waits for the shot, and puts lightning through his back. Cold, precise, no flourish, timed for the moment the light comes up.',
      'The season ends with her having everything. It is also the peak — everything from here is her running the same methods against people who have started to understand them, on a family that turns out not to be a foundation, and it takes exactly one more season to bring the whole thing down.'
