<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar — Points of View</title>
<style>
/* =========================================================================
   Avatar — Points of View
   Theme is driven entirely by CSS custom properties set on :root by app.js,
   so switching character or crossing a bending milestone re-colours the
   whole page in one transition.
   ========================================================================= */

:root {
  --c0: #3d8fc4;  --c1: #3d8fc4;  --c2: #3d8fc4;  --c3: #3d8fc4;   /* corner cores */
  --c4: transparent;                                                /* centre glow */
  --g0: #a9e4f2;  --g1: #a9e4f2;  --g2: #a9e4f2;  --g3: #a9e4f2;   /* corner glows */
  --core: #3d8fc4;
  --glow: #a9e4f2;
  --deep: #0b2f4a;
  --ink:  #e6f7ff;
  --paper: rgba(8, 12, 18, 0.58);

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
           Georgia, "Times New Roman", serif;
  --sans:  "Avenir Next", Avenir, "Segoe UI", Roboto, "Helvetica Neue",
           Helvetica, Arial, sans-serif;

  --ease: cubic-bezier(.22, .61, .36, 1);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--deep);
  transition: background-color 900ms var(--ease), color 900ms var(--ease);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---- ambient layer ----------------------------------------------------- */

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.ambient-wash {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(65% 55% at 0% 0%,    var(--c0) 0%, transparent 62%),
    radial-gradient(65% 55% at 100% 0%,  var(--c1) 0%, transparent 62%),
    radial-gradient(65% 55% at 100% 100%,var(--c2) 0%, transparent 62%),
    radial-gradient(65% 55% at 0% 100%,  var(--c3) 0%, transparent 62%),
    radial-gradient(46% 46% at 50% 50%,  var(--c4) 0%, transparent 70%);
  opacity: .62;
  transition: background 1100ms var(--ease), opacity 1100ms var(--ease);
}

.ambient-grain {
  position: absolute;
  inset: 0;
  opacity: .05;
  background-image:
    repeating-linear-gradient(0deg,   rgba(255,255,255,.5) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg,  rgba(255,255,255,.4) 0 1px, transparent 1px 4px);
  mix-blend-mode: overlay;
}

.corner {
  position: absolute;
  width: min(38vw, 420px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}
.corner-tl { top: -6%;    left: -6%; }
.corner-tr { top: -6%;    right: -6%; }
.corner-br { bottom: -6%; right: -6%; }
.corner-bl { bottom: -6%; left: -6%; }
.corner-mid {
  top: 50%; left: 50%;
  width: min(72vw, 860px);
  transform: translate(-50%, -50%);
  animation: none;
}
.corner-mid .sigil.on { opacity: .14; }

.sigil {
  width: 100%;
  height: 100%;
  opacity: 0;
  transform: scale(.82) rotate(-8deg);
  transition: opacity 1000ms var(--ease), transform 1000ms var(--ease),
              filter 1000ms var(--ease);
}
.sigil.on {
  opacity: .30;
  transform: scale(1) rotate(0deg);
}
.sigil.learning {
  opacity: .13;
  transform: scale(.9) rotate(-3deg);
}
.sigil.partial {
  opacity: .18;
  transform: scale(.94);
}
.sigil.renounced {
  opacity: .10;
  filter: grayscale(1) brightness(1.6);
}
.sigil svg { width: 100%; height: 100%; display: block; }

/* faint animated drift so the corners feel alive, not pasted on */
@keyframes drift {
  0%, 100% { transform: translate3d(0,0,0) }
  50%      { transform: translate3d(0, -10px, 0) }
}
.corner { animation: drift 14s ease-in-out infinite; }
.corner-tr { animation-delay: -3.5s; }
.corner-br { animation-delay: -7s;   }
.corner-bl { animation-delay: -10.5s;}

@media (prefers-reduced-motion: reduce) {
  .corner { animation: none; }
  .sigil, .ambient-wash, body, .card { transition-duration: 1ms !important; }
}

/* ---- masthead ---------------------------------------------------------- */

.masthead {
  position: relative;
  z-index: 2;
  padding: 34px clamp(18px, 4vw, 56px) 0;
}

.masthead-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 26px;
  border-bottom: 1px solid color-mix(in srgb, var(--glow) 22%, transparent);
  padding-bottom: 18px;
}

.brand { display: flex; align-items: center; gap: 14px; }

.brand-mark {
  width: 46px; height: 46px;
  display: inline-grid; place-items: center;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--glow) 45%, transparent);
  background: color-mix(in srgb, var(--core) 26%, transparent);
  transition: background 900ms var(--ease), border-color 900ms var(--ease);
}
.brand-mark svg { width: 68%; height: 68%; }

.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-title {
  font-family: var(--serif);
  font-size: 30px;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.brand-sub {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--glow) 78%, white);
}

.brand-note {
  margin: 0 0 4px auto;
  max-width: 40ch;
  font-size: 13px;
  line-height: 1.6;
  opacity: .68;
  text-align: right;
}

/* ---- cast rail --------------------------------------------------------- */

.cast {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 16px 0 14px;
  scrollbar-width: thin;
}
.cast::-webkit-scrollbar { height: 6px; }
.cast::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--glow) 30%, transparent);
  border-radius: 99px;
}

.cast-btn {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 15px 9px 9px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.05);
  color: inherit;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: background 260ms var(--ease), border-color 260ms var(--ease),
              transform 260ms var(--ease);
  white-space: nowrap;
}
.cast-btn:hover { background: rgba(255,255,255,.11); transform: translateY(-1px); }
.cast-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.cast-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--dot);
  box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset;
}
.cast-dot svg { width: 74%; height: 74%; opacity: .92; }

.cast-name { font-weight: 600; letter-spacing: .01em; }
.cast-role {
  font-size: 11px;
  opacity: .6;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.cast-btn[aria-pressed="true"] {
  background: color-mix(in srgb, var(--dot) 30%, rgba(255,255,255,.06));
  border-color: color-mix(in srgb, var(--dot) 70%, white 10%);
  box-shadow: 0 6px 24px -12px var(--dot);
}

/* ---- stage layout ------------------------------------------------------ */

.stage {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
  gap: clamp(18px, 3vw, 40px);
  padding: 26px clamp(18px, 4vw, 56px) 70px;
  align-items: start;
}

/* ---- episode rail ------------------------------------------------------ */

.rail {
  position: sticky;
  top: 20px;
  max-height: calc(100vh - 44px);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.book-tabs { display: flex; gap: 6px; margin-bottom: 12px; }

.book-tab {
  flex: 1;
  padding: 9px 6px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.04);
  color: inherit;
  font: inherit;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 220ms var(--ease);
}
.book-tab:hover:not(:disabled) { background: rgba(255,255,255,.1); }
.book-tab[aria-selected="true"] {
  background: color-mix(in srgb, var(--core) 34%, rgba(255,255,255,.05));
  border-color: color-mix(in srgb, var(--glow) 42%, transparent);
}
.book-tab:disabled { opacity: .34; cursor: not-allowed; }
.book-tab b {
  display: block;
  font-size: 11.5px;
  letter-spacing: .05em;
  white-space: nowrap;
}
.book-tab i { font-style: normal; font-size: 10px; opacity: .7; }

.episodes {
  position: relative;
  list-style: none;
  margin: 0;
  padding: 4px 6px 20px 0;
  overflow-y: auto;
  scrollbar-width: thin;
  min-height: 0;
}
.episodes::-webkit-scrollbar { width: 6px; }
.episodes::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--glow) 26%, transparent);
  border-radius: 99px;
}

.ep-btn {
  width: 100%;
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 10px;
  align-items: baseline;
  padding: 9px 11px;
  margin-bottom: 3px;
  border: 0;
  border-left: 2px solid transparent;
  border-radius: 0 8px 8px 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13.5px;
  text-align: left;
  line-height: 1.35;
  cursor: pointer;
  transition: background 200ms var(--ease), border-color 200ms var(--ease);
}
.ep-btn:hover { background: rgba(255,255,255,.07); }
.ep-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: -2px; }
.ep-btn .n {
  font-family: var(--serif);
  font-size: 12px;
  opacity: .5;
  letter-spacing: .06em;
}
.ep-btn[aria-current="true"] {
  background: color-mix(in srgb, var(--core) 26%, rgba(255,255,255,.04));
  border-left-color: var(--glow);
}
.ep-btn[aria-current="true"] .n { opacity: .95; }
.ep-btn.is-away .t { opacity: .5; }
.ep-btn .flag {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-left: 6px;
  vertical-align: middle;
  background: var(--glow);
  box-shadow: 0 0 8px var(--glow);
}

/* ---- panel ------------------------------------------------------------- */

.panel {
  background: var(--paper);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  border: 1px solid color-mix(in srgb, var(--glow) 26%, transparent);
  border-radius: 20px;
  padding: clamp(24px, 3.4vw, 46px);
  box-shadow:
    0 40px 90px -50px rgba(0,0,0,.9),
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 0 70px -40px var(--core) inset;
  transition: border-color 900ms var(--ease), box-shadow 900ms var(--ease),
              background 900ms var(--ease);
  outline: none;
  min-height: 60vh;
}

.panel.swap { animation: swap 420ms var(--ease); }
@keyframes swap {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.panel-head { border-bottom: 1px solid rgba(255,255,255,.11); padding-bottom: 20px; }

.ep-meta {
  font-size: 11px;
  letter-spacing: .26em;
  text-transform: uppercase;
  opacity: .62;
  display: flex;
  gap: 10px;
}
.ep-sep { opacity: .5; }

.ep-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(28px, 3.6vw, 44px);
  line-height: 1.12;
  margin: 12px 0 10px;
  letter-spacing: -.01em;
}

.ep-logline {
  margin: 0;
  font-size: 15px;
  line-height: 1.6;
  opacity: .7;
  max-width: 62ch;
}

/* who + bending */

.who {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 28px;
  align-items: flex-end;
  justify-content: space-between;
  padding: 22px 0 18px;
}

.who-name {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 25px;
  margin: 0;
  letter-spacing: .02em;
}
.who-epithet {
  margin: 4px 0 0;
  font-size: 11.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  opacity: .62;
}

.bending { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 13px 6px 7px;
  border-radius: 99px;
  font-size: 12px;
  letter-spacing: .04em;
  border: 1px solid color-mix(in srgb, var(--chip) 60%, transparent);
  background: color-mix(in srgb, var(--chip) 20%, transparent);
}
.chip i {
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: color-mix(in srgb, var(--chip) 55%, transparent);
}
.chip i svg { width: 76%; height: 76%; }
.chip b { font-weight: 600; }
.chip s {
  text-decoration: none;
  opacity: .62;
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.chip.state-learning  { border-style: dashed; }
.chip.state-partial { border-style: dotted; }
.chip.state-renounced { filter: grayscale(.75); opacity: .72; }
.chip.state-renounced b { text-decoration: line-through; text-decoration-thickness: 1px; }

/* prose */

.who-blurb {
  margin: -4px 0 20px;
  font-size: 13.5px;
  line-height: 1.65;
  max-width: 66ch;
  opacity: .6;
  padding-left: 13px;
  border-left: 1px solid color-mix(in srgb, var(--glow) 30%, transparent);
}

.pov {
  font-family: var(--serif);
  font-size: clamp(17px, 1.35vw, 19.5px);
  line-height: 1.72;
  max-width: 68ch;
  padding-top: 6px;
}
.pov p { margin: 0 0 20px; }

.pov .beat {
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.55;
  letter-spacing: .01em;
  padding: 14px 18px;
  margin: 4px 0 0;
  border-left: 2px solid var(--glow);
  background: color-mix(in srgb, var(--core) 16%, transparent);
  border-radius: 0 10px 10px 0;
  opacity: .95;
}
.pov .beat span {
  display: block;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  opacity: .6;
  margin-bottom: 5px;
}

.away-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: .24em;
  text-transform: uppercase;
  opacity: .62;
  margin-bottom: 14px;
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px dashed rgba(255,255,255,.28);
}
.pov.is-away p { opacity: .82; font-style: italic; }

/* milestones */

.milestones:empty { display: none; margin: 0; }
.milestones { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 4px; }
.milestone {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 12.5px;
  padding: 9px 15px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--glow) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--glow) 34%, transparent);
}
.milestone::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--glow);
  box-shadow: 0 0 10px var(--glow);
}

/* stepper */

.stepper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 30px;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,.11);
}

.step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.04);
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 220ms var(--ease), transform 220ms var(--ease),
              border-color 220ms var(--ease);
  min-width: 0;
}
.step:hover:not(:disabled) {
  background: color-mix(in srgb, var(--core) 22%, rgba(255,255,255,.05));
  transform: translateY(-1px);
  border-color: color-mix(in srgb, var(--glow) 40%, transparent);
}
.step:disabled { opacity: .3; cursor: default; }
.step-next { justify-content: flex-end; text-align: right; }
.step-arrow { font-size: 17px; opacity: .7; flex: 0 0 auto; }
.step-label { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.step-label em {
  font-style: normal;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  opacity: .55;
}
.step-label b {
  font-weight: 500;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hint {
  margin: 18px 0 0;
  font-size: 11.5px;
  letter-spacing: .06em;
  opacity: .42;
  text-align: center;
}
kbd {
  font: inherit;
  font-size: 10.5px;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,.24);
}

/* ---- responsive -------------------------------------------------------- */

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; }
  .rail { position: static; max-height: none; }
  .episodes { max-height: 260px; }
  .brand-note { display: none; }
  .who { align-items: flex-start; flex-direction: column; }
  .corner { width: 62vw; }
}

@media (max-width: 560px) {
  .stepper { grid-template-columns: 1fr; }
  .step-next { justify-content: flex-start; text-align: left; flex-direction: row-reverse; }
}

</style>
</head>
<body>

<!-- ambient element theming -------------------------------------------- -->
<div class="ambient" aria-hidden="true">
  <div class="ambient-wash"></div>
  <div class="ambient-grain"></div>
  <div class="corner corner-tl"><div class="sigil" data-corner="0"></div></div>
  <div class="corner corner-tr"><div class="sigil" data-corner="1"></div></div>
  <div class="corner corner-br"><div class="sigil" data-corner="2"></div></div>
  <div class="corner corner-bl"><div class="sigil" data-corner="3"></div></div>
  <div class="corner corner-mid"><div class="sigil" data-corner="4"></div></div>
</div>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-text">
        <span class="brand-title">Avatar</span>
        <span class="brand-sub">Points of View</span>
      </span>
    </div>
    <p class="brand-note">The same story, sixty-one times over, told from wherever each of them was standing.</p>
  </div>

  <nav class="cast" id="cast" aria-label="Choose a character"></nav>
</header>

<main class="stage">

  <!-- episode navigator ---------------------------------------------- -->
  <aside class="rail" aria-label="Episodes">
    <div class="book-tabs" id="bookTabs" role="tablist"></div>
    <ol class="episodes" id="episodeList"></ol>
  </aside>

  <!-- reading panel --------------------------------------------------- -->
  <section class="panel" id="panel" tabindex="-1">

    <div class="panel-head">
      <div class="ep-meta">
        <span class="ep-book" id="epBook"></span>
        <span class="ep-sep">·</span>
        <span class="ep-num" id="epNum"></span>
      </div>
      <h1 class="ep-title" id="epTitle"></h1>
      <p class="ep-logline" id="epLogline"></p>
    </div>

    <div class="who">
      <div class="who-id">
        <h2 class="who-name" id="whoName"></h2>
        <p class="who-epithet" id="whoEpithet"></p>
      </div>
      <div class="bending" id="bending" aria-label="Bending at this point in the story"></div>
    </div>

    <p class="who-blurb" id="whoBlurb"></p>

    <article class="pov" id="pov"></article>

    <div class="milestones" id="milestones"></div>

    <nav class="stepper">
      <button class="step" id="prevBtn" type="button">
        <span class="step-arrow">&#8592;</span>
        <span class="step-label"><em>Previous</em><b id="prevTitle"></b></span>
      </button>
      <button class="step step-next" id="nextBtn" type="button">
        <span class="step-label"><em>Next</em><b id="nextTitle"></b></span>
        <span class="step-arrow">&#8594;</span>
      </button>
    </nav>

    <p class="hint">Arrow keys move between episodes · <kbd>1</kbd>–<kbd>7</kbd> switch character</p>
  </section>
</main>

<script>
/* =========================================================================
   ATLA — Points of View
   Character definitions + bending timelines.

   ELEMENT STATES
     'learning'   — has begun, not yet in command of it
     'mastered'   — in full command
     'renounced'  — has touched it and deliberately turned away from it

   `at` is a GLOBAL episode index (Book 1 = 1..20, Book 2 = 21..40,
   Book 3 = 41..61). A character's state for any element at episode i is the
   most recent timeline entry with at <= i.
   ========================================================================= */

window.ATLA = window.ATLA || {};

/* ---- Element palettes -------------------------------------------------- */
window.ATLA.ELEMENTS = {
  air: {
    name: 'Air',
    label: 'Airbending',
    core: '#f2a444',
    glow: '#ffd79a',
    deep: '#3a2408',
    ink: '#fff4e2'
  },
  water: {
    name: 'Water',
    label: 'Waterbending',
    core: '#3d8fc4',
    glow: '#a9e4f2',
    deep: '#07202f',
    ink: '#e6f7ff'
  },
  earth: {
    name: 'Earth',
    label: 'Earthbending',
    core: '#5f9e46',
    glow: '#cfe0a0',
    deep: '#132612',
    ink: '#f0f7e2'
  },
  fire: {
    name: 'Fire',
    label: 'Firebending',
    core: '#d23b2c',
    glow: '#ffb057',
    deep: '#2a0806',
    ink: '#ffeede'

      'He comes out of a hundred years of ice and the very first thing he says to the girl standing over him is a question about whether she wants to go penguin sledding. Not "where am I." Not "how long." Penguin sledding. He has no sense that any time has passed at all, and the episode is careful to give you every piece of evidence at once: the sneeze that fires him forty feet into the air, the marble trick he does to impress Katara that she does not look up for, the airball game he starts in the middle of a village that has not seen a bender in living memory. He is a boy who has woken up somewhere new and has decided it is a holiday.',

      'And then, because he cannot help himself, he takes Katara aboard the derelict Fire Navy ship frozen into the ice to explore it, and trips a century-old booby trap that sends a flare up over the South Pole. Everything that happens in this series happens because a twelve-year-old wanted to show a girl something cool.'

  '1x01': {
    text: [
      'She opens the series talking to us, because she is the one carrying the history: her mother is dead, her father and every fighting man in the tribe sailed off to the war two years ago, and the Southern Water Tribe is now grandmothers, small children, and her. She does the sewing, the cooking and the washing for all of them, and she is the last waterbender left in the entire South — untrained, self-taught, working from nothing, because the Fire Nation raids took every other one.',
      'And then Sokka pushes her one time too many out on the ice, and she loses her temper, and the temper cracks a glacier in half. It is worth sitting with how the show chooses to do this: the Avatar returns to the world because a fourteen-year-old girl got furious about being told what girls do. Her anger is not a flaw the series makes her grow out of. It is the engine.',
      'What she does next is characteristic. A strange boy climbs out of a hundred-year-old iceberg and her first instinct is not suspicion, it is to help him up. She brings him back to a village that does not want him, argues for him, and is delighted by him. She has been the only person in her world holding onto the idea that things could change, and something impossible just surfaced in front of her.'
    ],
    beat: 'Her anger frees the Avatar. The show never once treats that as an accident.'
  },

  '1x02': {
    text: [
      'When Sokka banishes Aang, Katara is the only voice on the other side, and she puts it in the hardest available terms — she tells her brother that if Aang goes, she goes. Then she has to actually stand there while Aang leaves and she stays, because these are her people and her grandmother, and the show lets that cost sit for a minute.',
      'When Zuko\'s ship comes through the wall she throws herself at a Fire Nation prince with about four weeks of self-taught bending and no plan, and she is brushed aside. Aang surrenders to spare them. And Katara does not deliberate for even a beat — she is already dragging Sokka toward Appa.',
      'What she wants gets stated plainly here and does not waver for three seasons: a master who will teach her properly, and a world where the Fire Nation cannot do to another family what it did to hers. Gran Gran does not try to stop her. Gran Gran tells her she has been waiting for this since the day Aang was frozen, and hands her granddaughter to the war.'
    ],
    beat: 'Leaves home in an afternoon, and names exactly what she is leaving for.'
  },

  '1x03': {
    text: [
      'She works out what is waiting at the Southern Air Temple somewhere over the mountains, and she spends the entire flight trying to build a landing that cannot be built — floating the idea that maybe the airbenders escaped, then trying to steer him away from the courtyard once she sees the armour. Sokka tries the same thing from the other direction. Neither of them can do anything but delay it.',
      'And then it happens, and the temple starts tearing itself apart with Aang glowing white at the centre, and Katara walks into that. Sokka tells her not to. She goes anyway, up the wind, close enough to be heard, and says the thing that holds him together for the next three years: Monk Gyatso and the airbenders are gone, but she and Sokka are his family now.',
      'It is the first time she does the job she will keep doing for the whole series — walking directly into someone\'s worst moment and staying — and she is fourteen and she appoints herself to it without anyone asking.'

  '1x04': {
    text: [
      'Kyoshi is where she gets to be less than perfect and the show is glad about it. Aang starts performing for a crowd of admiring island girls and stretches a one-day stop into an indulgence, and Katara calls it out — accurately — and gets told she is jealous, and the honest reading is that she is a bit of both. She has been the one keeping this boy fed and moving and grounded since the day she found him, and now he is doing loops for strangers.',
      'She storms off. She is still the person who goes into the water when the unagi puts him under, hauls him out, and bends the seawater out of his lungs — the first time we see her use waterbending to save a life rather than fight with it.',

    beat: 'The first crack in playing perfect older sister to a boy older than her tribe.'
  },

  '1x05': {
    text: [
      'Omashu is mostly comedy for her and she carries it: hostage in a mad king\'s palace with jennamite crystal creeping up her arm toward her shoulder, playing the invented aunt of an invented decrepit uncle, and improvising an entire fake family history at speed while Aang solves riddles somewhere else in the building.',
      'The reason it is worth a note is what it establishes. She is now the one managing Aang — reading the room, buying him time, keeping the lie running — rather than following him around. Between this and Kyoshi, the balance of the group has quietly changed within five episodes of leaving home.'

    beat: 'Slides, permanently, into the role of the one who handles him.'

  '1x06': {
    text: [
      'The first episode that is entirely hers, and it is a thesis statement. She finds Haru earthbending in secret to save an old man from a collapsed mine, watches the old man immediately sell him to the Fire Nation for the reward, and then gets herself deliberately arrested — faking earthbending with Aang throwing rocks from the ledge above — to get onto the prison rig.',
      'What she finds there is not cruelty so much as surrender. The Warden has put earthbenders on a metal platform in the middle of the ocean where there is nothing to bend, and after long enough they have stopped being benders in their own heads. Haru\'s father Tyro tells her to keep her head down and survive. She gives a speech about her mother, about the South, about what her tribe would do, and it lands on nothing — an entire hold of men who will not look up.',
      'Then Aang and Sokka blow the coal supply out onto the deck, and she stands in the middle of a black storm of it shouting at them to take it, and for a long, awful beat nobody moves. What breaks it is Haru. Then Tyro puts the Warden in the sea. She wins, and she loses her mother\'s necklace doing it, and Zuko is going to find it.'
    ],
    beat: 'Discovers her real weapon is not water — and pays for it with the last thing of her mother\'s.'
  },

  '1x07': {
    text: [
      'The acorn is hers. When Aang stands in the burnt forest deciding it is his fault, she crouches down, picks one out of the ash, and shows him that the forest is already rebuilding itself — an image he then carries into the Spirit World and uses to end the whole crisis. She has no idea she has just handed him the solution.',
      'Then the night comes, and this is one of the episodes where the limits are the point. She cannot go where Aang goes. She holds a terrified village together, keeps Sokka from doing something stupid before Hei Bai takes him anyway, and then sits outside a wall she has no way to cross, waiting for a twelve-year-old to come back from the dead. There is a version of this season that is Katara learning how much of it she will have to watch.'
    ],
    beat: 'Hands him the answer without knowing it, then has to wait outside the door.'
  },

  '1x08': {
    text: [
      'Aang tries to go to the Crescent Island alone, which is exactly the sort of self-sacrificing arithmetic she will spend three seasons refusing, and she and Sokka simply get on the bison. She is at Appa\'s reins running Zhao\'s blockade with black snow falling around them.',
      'Inside the temple she is captured by the Fire Sages and chained to a pillar, and the episode leaves her there while the important conversation happens on the other side of a door. But something has changed since Kyoshi: she and Sokka are not passengers to be rescued any more, they are a crew that made a decision. When Roku brings the volcano up through the floor, they are already running for the bison.'
    ],
    beat: 'Refuses, on principle, to let him go into danger alone. The first of many.'

  '1x09': {
    text: [
      'Her best and worst instincts arrive within twenty minutes of each other. She is the teacher, and the student picks up in three tries what took her years of practising alone on the ice with nobody to correct her, and she does not handle it well. She snaps at him hard enough that he is nearly in tears, and then hates herself for it.',
      'So when she finds a genuine waterbending scroll on a pirate ship and cannot pay for it, she takes it. And then lies about it. And then sneaks off at night to practise it alone, furious and muttering, so that she can get ahead again — and gets herself, and everyone, caught by pirates who want the scroll back.',
      'Zuko ties her to a tree and holds her mother\'s necklace in front of her face, and offers a trade, and she says nothing. The episode is generous about all of it: Sokka gets them out with an absurd sales pitch, Aang never once mentions it, and Katara admits at the end that she stole and got everyone nearly killed for it — and then immediately makes an exception in her personal ethics for stealing from pirates. She is fourteen. The show likes her more for the crime, not less.'
    ],
    beat: 'Her worst hour, played without excuses — and forgiven by everyone but her.'
  },

  '1x10': {
    text: [
      'Jet has lost his mother and father to the Fire Nation in the same way she lost hers, and he is her own age, and he is the first person in the series who understands her grief without needing it explained. She is not just charmed; she is recognised. It is the most unguarded and least maternal she is in the entire season, and she is glowing.',
      'And it makes her useful to him. He tells her the Fire Nation will burn the forest, and she fills the reservoir above Gaipan with him, and she dismisses Sokka\'s warnings as jealousy — which is the same accusation she made of Aang on Kyoshi, aimed the other way.',
      'When she sees the blasting jelly under the dam, Jet does not deny it. He explains it: the valley is worth it, the people down there are collaborators, this is what winning costs. And Katara — who has every reason to find that argument persuasive, who has more cause to hate the Fire Nation than anyone standing there — freezes him to a tree with his own reservoir. Nobody has to talk her into it. She has just seen where her own grief could take her and she gets off the road herself.'
    ],
    beat: 'Meets the version of herself that grief could make, and freezes it to a tree.'
  },

  '1x11': {
    text: [
      'She takes the Gan Jin side of a century-old feud roughly eleven minutes after meeting them, defends it with total conviction, and spends the episode in a shouting match with her brother about a crime committed by two men who died a hundred years ago. It is broad comedy and it is also a real note about her: her loyalty is instant and complete, and it attaches before the facts are in.',
      'She is also, throughout, the one keeping the injured guide alive and the group moving, which nobody thanks her for either.'

    beat: 'Her loyalty is a reflex — and reflexes can be pointed anywhere.'

  '1x12': {
    text: [

      'And when he says the war happened because he ran, she does not tell him he is being ridiculous, or list the reasons it is not his fault, or hand him a lesson. She lets it be true for him and stays anyway. It is the first time she carries something of his she cannot fix, and it is the moment the two of them stop being rescuer and rescued.'

    beat: 'Learns that the job is sometimes just staying in the room.'
  },

  '1x13': {
    text: [
      'Flat on her back with a storm fever, sweating, hallucinating, still trying to mother Sokka from inside a delirium — she calls him by their father\'s name at one point — and completely dependent on a twelve-year-old going out alone into occupied territory to find frozen frogs.',
      'It is the one episode she cannot protect anybody, including herself, and it happens to be the night Zhao\'s archers take Aang. She wakes up to find that the most dangerous thing that has happened to him all season happened while she was unconscious, and that he came back with a mask he will not explain.'

    beat: 'The one night she cannot stand between him and anything.'

  '1x14': {
    text: [
      'She is perfectly sensible about fortunetelling for about ninety seconds, which is until Aunt Wu tells her she will marry a very powerful bender, and then she is entirely gone — coming back for more readings, checking every bender she meets against the prediction, reading her own future in bone cracks and cloud shapes with total sincerity. Sokka is scathing. She does not care.',
      'It is the only episode in Book One where she gets to want something for herself that is not survival, justice or someone else\'s wellbeing, and the show is warm about it rather than mocking. She is thirteen and she would like to know whether anything nice is going to happen to her.',

    beat: 'Allowed, for one episode, to simply be a girl who wants good news.'
  },

  '1x15': {
    text: [
      'Bato\'s tent is full of her father — the smell of sea prunes, the old stories, someone who remembers her mother. She has been the mother of her own family for two years, and here is a room where she is allowed to be a daughter, and she is visibly younger inside it. She stands with Sokka in the ice-dodging ceremony and takes the Mark of the Brave.',

    beat: 'Hurt by him, and done being angry before she is done being hurt.'

  '1x16': {

  '1x17': {

  '1x18': {
    text: [
      'Twenty episodes of travelling have been pointed at this: an intact Water Tribe city, a feast, and a real master. And Pakku tells her that in the North, women do not learn to fight. They learn healing. He does not even bother to be cruel about it; he says it the way you state the weather, and then turns back to Aang.',
      'She tries the healing hut. She is furious in it. Aang starts teaching her his lessons in secret at night, they are caught, and Pakku throws him out as a student — which means her fight has now cost the Avatar his waterbending master four episodes after a comet was put on the calendar.',
      'So she challenges Pakku in the courtyard in front of the entire tribe. And she loses — he is the best waterbender alive and she is a self-taught fourteen-year-old — but she makes him work, she pushes him back, and by the end nobody watching can pretend the rule was ever about capability. Then her betrothal necklace comes off in the snow and Pakku picks it up, and it is the one he carved sixty years ago for Kanna, who walked out of an arranged marriage and went south rather than live under this exact rule. Her grandmother\'s refusal and her own turn out to be the same argument, sixty years apart, and this time it wins.'

    beat: 'Loses the duel and wins the argument — and inherits her grandmother\'s fight by accident.'

  '1x19': {
    text: [

      'And then she is alone in the Spirit Oasis with Aang\'s empty body on the grass and Zuko coming up out of a tunnel with three days of ice in his hair, and she holds him — genuinely holds him, longer than anyone expects — before he overpowers her and takes Aang out into the blizzard. She wakes up on the grass with the Avatar gone and immediately goes after him.'
    ],
    beat: 'The untrained one is gone. She is the reliable one now.'
  },

  '1x20': {
    text: [
      'She catches Zuko in the snowfield at sunrise and beats him. Not a trick, not a rescue, not an interruption — a straight fight against the person who has beaten every one of them at some point since episode two, ended by her, with the sun coming up. It is the first clean win Team Avatar takes off him, and she takes it a season after being a girl who could barely lift a puddle.',
      'Then she carries Aang back and stands over him in the Spirit Oasis while the world outside comes apart: Zhao takes the moon out of the pond, the sky goes red, and every waterbender in the city — including her, mid-motion — simply stops. She has spent twenty episodes chasing this power and she watches it be switched off.',
      'She is there when Yue walks to the pond and gives her life back to the Moon, and she is there when Aang comes out of the water as something enormous. She holds the line at the exact centre of it and does not move.'

  }

window.ATLA.pov.sokka = {

  '1x01': {
    text: [
      'He is fifteen, and he is the only man in a village made of grandmothers and toddlers, and he has decided to take that as literally as it can be taken. He paints his face. He keeps watch. He runs combat drills for six-year-olds who need to be taken to the toilet halfway through. He tells his sister to fix his pants and delivers an opinion about girls that gets him hit with them.',
      'And when a boy climbs out of a glacier, Sokka assumes Fire Nation infiltration, which is played as ridiculous and is not remotely ridiculous. The Fire Nation took his mother. Then it took his father and every other fighting man in the tribe. He is the last line in front of about forty people and he knows exactly how thin the line is.',
      'He is wrong about Aang in every particular and right about the shape of the danger, which is going to be his exact problem for the whole season.'
    ],
    beat: 'His paranoia is insufferable, and it is also the only thing standing between his village and the sea.'
  },

  '1x02': {
    text: [
      'He banishes Aang, and the show does not pretend it is unreasonable — the flare went up, the ship is coming, and Sokka is the one who has to weigh a stranger against everyone he has left. Katara tells him if Aang goes she goes, and he holds the line anyway.',
      'Then the prow of a Fire Nation cruiser comes through the ice wall, and Sokka puts on his father\'s war paint, picks up a boomerang and a bone club, and stands on that wall by himself to meet it. He is flattened in about four seconds — Zuko kicks him off it without breaking stride — and he gets back up and charges again. It is genuinely one of the bravest things anyone does in Book One and it accomplishes nothing at all, which the episode is honest about.',
      'And then twelve hours later he is on a flying bison heading north, having given up the identity he built the whole first episode around. For a boy who defined himself entirely by not leaving, he leaves very quietly and nobody makes a speech about it.'
    ],
    beat: 'Loses the fight badly. He was still the only one standing there.'
  },

  '1x03': {
    text: [
      'He works out what happened at the Southern Air Temple at roughly the same moment Katara does — probably at the Fire Nation helmet in the snow — and unlike Katara he does not try to prepare Aang for it. He just quietly, clumsily tries to steer him away from the courtyard, invents reasons to go somewhere else, blocks a doorway.',
      'It does not work, and it is the kindest thing anybody does in the episode, and Sokka never mentions it or gets credit for it. This is the first real evidence that the sarcasm is a surface: he watches everyone constantly and he acts on what he sees without narrating it.'
    ],
    beat: 'The first sign that under the jokes he is the one watching everybody.'
  },

  '1x04': {
    text: [
      'He informs an island of women warriors that girls do not fight, gets tied up by them in the dark, and then gets systematically taken apart by Suki in a training hall while she barely changes expression. And then he does the thing that almost no character in a children\'s cartoon is allowed to do: he comes back, alone, head down, and apologises properly — no joke to soften it — and asks her to teach him.',
      'She makes him wear the uniform. He calls it a dress once, and then he puts on the robes and the face paint and does not make another joke about it for the rest of the episode, because he has worked out that this is the point. Suki teaches him the thing that becomes his entire fighting style for three seasons: it is not about strength, it is about using your opponent\'s force against them — which is, not incidentally, how a non-bender survives in a world of benders.',
      'When they leave he apologises again, properly, and she kisses him on the cheek and tells him she is a warrior and a girl. Twenty minutes from sexist to student to something like an equal.'

  '1x05': {
    text: [

      'He also gets in the one genuinely useful observation of the hour: he is the person who keeps asking what the tests are actually for, which is closer to Bumi\'s answer than anything Aang says.'

    beat: 'Correct about the danger, ignored, and slowly encased in rock candy.'
  },

  '1x06': {
    text: [
      'He tells Katara the plan is reckless. He lists the specific ways it will fail. He is right about every one of them — she is deliberately putting herself in Fire Nation custody on a rig in the middle of the ocean on the strength of a speech — and then he helps her do it anyway.',
      'That is the whole engine of Sokka in one episode. He does not need to win the argument; he needs her to come back. And when the speech fails and the hold does not move, it is Sokka and Aang who go for the coal, and Sokka who works out how to get several tons of it up the ventilation shafts and out onto the deck where the benders are standing.'
    ],
    beat: 'Objects on the record, complies in practice, and then solves the logistics.'
  },

  '1x07': {
    text: [
      'He is loudly, cheerfully contemptuous of the whole spirit business right up until a thirty-foot black-and-white spirit picks him up out of the middle of Senlin Village and carries him into the trees, and then he is simply gone for most of the episode.',

  },

  '1x08': {
    text: [
      'The blockade is his. Aang wants to fly at it, Katara wants to argue about whether to go at all, and Sokka is the one who looks at the smoke coming off a line of Fire Nation cruisers and works out that a bison can go over the top of it if the timing is right.',
      'Inside the temple he tries the same trick again — a fake firebending bomb rigged out of lamp oil to blow the sanctuary doors — and this time it fails, loudly, and brings the sages down on them. So the episode gives him both halves honestly: the plan that saves everyone, and the plan that gets him and Katara chained to a pillar. This is the first Sokka Plan. There are going to be a great many, and they will not all work.'

    beat: 'The first Sokka Plan gets them through a blockade. The second gets him arrested.'
  },

  '1x09': {
    text: [
      'He clocks the pirates as pirates roughly four seconds after everybody else has started shopping, which is his usual position: correct, early, and ignored. He is the one who notices the "curio" shop is a fence and that they are being watched.',
      'And when it all goes wrong, he improvises the single most Sokka solution available in the moment — an extended, straight-faced, genuinely committed sales pitch to a pirate captain about the untapped market opportunity of a giant flying bison, purely to burn thirty seconds. It works. Then he gets everyone onto the river, and when the pirates\' boat is bearing down he is the one shouting the steering.'
    ],
    beat: 'The con-artist detector and the con artist, in the same man, in the same hour.'
  },

  '1x10': {
    text: [
      'He distrusts Jet on sight and everyone assumes it is jealousy, including his sister. Then he watches Jet beat and rob an unarmed old man in the woods and is told the man was an assassin, and he does not buy it — and still nobody listens, because Jet is charismatic and Sokka is the one who is always saying no.',
      'So he follows him at night, alone, and overhears the actual plan: blasting jelly under the dam, the reservoir Katara and Aang have just filled, and a valley full of civilians below it. The Freedom Fighters catch him and tie him to a tree.',
      'He gets loose. He runs the whole way down to Gaipan. And he gets an entire village — Fire Nation-occupied, full of people who have no reason to trust a Water Tribe boy screaming at them — up the hillside before the water arrives. He saves every one of them, and the episode ends without a single character on screen thanking him for it. Being right, this week, costs him a beating, a night tied to a tree, and his sister\'s trust, and he does it anyway.'
    ],
    beat: 'The one time being the suspicious one saves everybody, and nobody in the episode thanks him.'
  },

  '1x11': {
    text: [
      'He takes the Zhang side of a hundred-year feud largely because Katara took the other one, is starving for the entire runtime, and reaches his all-time peak of pettiness somewhere around the argument about who stole what from whom in the year of somebody\'s grandfather.',
      'He is also the one who works out the canyon crawlers — that the things hunting them are also the way out, if you can get on one — which is a genuinely good tactical idea delivered by a man too hungry to enjoy having had it.'
    ],
    beat: 'At his most ridiculous, still the one who finds the way out of the hole.'
  },

  '1x12': {
    text: [
      'He hires himself out for a day on a fishing boat because the group needs money, which is an unglamorous, entirely unremarked-upon thing to do and exactly like him. The old fisherman spends the morning complaining that the Avatar abandoned the world and left everyone to burn — and Sokka, who is soaked, badly paid, and being shouted at, defends Aang to a stranger with no audience and nothing to gain by it.',
      'Then the storm comes in and Sokka is in the water with a man who insulted his friend all day, and he goes back for him. The last piece is quiet and good: after Aang pulls them both out, it is the fisherman who says thank you, and Sokka lets that happen instead of saying anything.'
    ],
    beat: 'Loyal loudest when Aang is not there to hear it.'
  },

  '1x13': {
    text: [
      'Delirious with fever, convinced his own hands are enormous, holding negotiations with things that are not there, and at one point cheerfully announcing that he is going to fight a hallucination. It is one of the funniest performances in the season.',
      'It is also, structurally, the point: on the single most dangerous night Aang has had since the series began — netted by the Yuyan archers, shackled in Zhao\'s fortress, rescued by a masked stranger — Sokka, the one who worries, the one who keeps watch, is flat on his back and useless. He wakes up sucking on a live frog.'
    ],
    beat: 'The one night he cannot be the watchman, and it is the night it mattered.'
  },

  '1x14': {
    text: [
      'He is the only empiricist in a town that has outsourced every single decision — planting, marriage, roofing — to a fortuneteller, and he is right, and he is completely unbearable about it, and it gains him nothing whatsoever. He tries to disprove Aunt Wu by force of argument. He tries by counter-example. Every attempt makes the village like him less.',
      'And then Mount Makapu erupts exactly as he said it would and Sokka stops arguing and starts working: he organises the villagers, gets a trench dug across the lava\'s path with the earthbenders, and builds the thing that actually holds the flow long enough for Aang to freeze it. He saves the town and the town credits the prophecy.',
      'That is the real lesson of the episode for him, and it is a bleak one for a fifteen-year-old: being right and being believed are two entirely separate problems, and only one of them is solved by being right.'

    beat: 'Correct, insufferable, ignored — and then the reason the town is still standing.'
  },

  '1x15': {
    text: [

      'And then he turns around. He comes back for Aang, and when he says it out loud it is the most direct thing he says all season: Aang is their family too, and they are not leaving him. He chooses the family he found over the family he is owed, and then spends the rest of the episode inventing the perfume-cloud trick that blinds June\'s shirshu and wins the fight.'

  '1x16': {

      'He is also the person who watches Aang getting impatient with the leaf drills and says out loud, before it happens, that this is going to end badly. He is ignored, and then Katara\'s hands are burned. He does not say I told you so, which is arguably his single greatest act of restraint in Book One.'

  '1x17': {
    text: [
      'He walks into the Mechanist\'s workshop and something switches on that does not switch off for three seasons. Gliders, pressure valves, hot-air engines, a war balloon prototype nobody can quite make steer — and Sokka and the Mechanist are instantly, happily deep in it, finishing each other\'s calculations while Aang is having a crisis about the wallpaper.',
      'This is the episode that quietly names what he actually is. Not a swordsman who tells jokes, not the one without powers: an engineer. He and the Mechanist fix the balloon, and then in the battle Sokka flies it, drops the bombs, and — when bombing is not enough — cuts the engine loose and drops it into a gas-filled chasm to take out the invasion force below.',

window.ATLA.pov.zuko = {

  '1x01': {
    text: [
      'We meet him drilling firebending forms on the deck of his own ship at dawn, badly, with his uncle telling him his basics are sloppy and to try it again. He is sixteen. He has been at sea for three years hunting a man who has been missing for a hundred, and the entire Fire Navy considers it a joke.',
      'Then the light goes up over the southern ice — Aang\'s flare from a derelict ship, though Zuko will never learn that — and Iroh tells him it is celestial, probably nothing, and suggests he sit down and finish his tea. Zuko looks at it and simply knows, in the way that only someone with nothing else left believes anything, and turns the ship south.',
      'The show gives you his whole condition in four minutes: the discipline, the temper, the certainty that is indistinguishable from desperation, and an uncle who is very obviously trying to slow him down.'
    ],
    beat: 'Everyone else sees a strange light. He sees the only door back into his own house.'
  },

  '1x02': {
    text: [
      'He drives a warship straight through the wall of a village of sixty people, and what steps out to meet him is a boy in orange with a stick. The disappointment is written all over him — three years, and the greatest threat to the Fire Nation is twelve. He shoves past Katara, threatens the elderly, and demands they hand over the old man they must be hiding.',
      'And then Aang surrenders to him voluntarily, which should be the end of the series. He has the Avatar in irons within twenty minutes of finding him. He takes the staff, locks him below, and turns for home.',
      'By the end of the hour the prize has blown his crew off their own deck on a column of seawater and flown away on a bison, and Zuko is standing on a wrecked ship in the middle of the ice, soaked, with nothing. The pattern of his entire first season is set in a single afternoon: he wins, briefly, completely — and it goes through his hands every time.'
    ],
    beat: 'Catches the Avatar in episode two, and loses him in episode two.'
  },

  '1x03': {
    text: [
      'Ship damaged, crew resentful, forced into a Fire Nation port for repairs — and there is Commander Zhao, who takes one look at the situation and starts enjoying himself. He gets Zuko\'s crew to confirm the Avatar is alive, seizes the hunt on his own authority, and then says the thing designed to land: that Zuko\'s father did not send him on a mission, he sent him away, and that after three years the Fire Lord has probably stopped thinking about him altogether.',
      'So Zuko challenges a superior officer to an Agni Kai in front of the garrison, and wins — Zhao is aggressive, over-committed and slow, and Zuko takes him apart with the exact basics Iroh was nagging him about in episode one.',
      'And then, with Zhao flat on the ground and the killing move available, he does not take it. He puts his fire into the stone beside Zhao\'s head and walks away. Zhao throws a cheap shot at his back; Iroh catches it without looking. On the way out Iroh tells his nephew he is proud of him, and Zuko cannot hear it, because the only approval that counts is from a man three thousand miles away who is not thinking about him.'
    ],
    beat: 'Beats Zhao, refuses the finishing blow, and gets praised by the one person whose praise he discounts.'
  },

  '1x04': {
    text: [
      'The episode opens with him meditating with candles and claiming he has his temper under control, and then losing it within the minute because the reports do not include a location. Iroh shows him a map of Avatar sightings scattered over a whole hemisphere — the target is not being tracked, it is being rumoured — and Zuko\'s answer is to sail at the newest rumour anyway.',
      'When the news from Kyoshi Island reaches him he takes rhino cavalry into a village that is not garrisoned, is not strategic, and has no involvement in the war beyond having been kind to a twelve-year-old for two days, and he starts burning it to flush Aang out. The Kyoshi Warriors fight him in the street. Houses go up. The great statue goes up.',
      'He gets his duel on a rooftop, loses the Avatar again, and sails away leaving a town on fire behind him. It is Zuko at his worst in Book One, and the episode is very deliberate about lingering on the smoke — this is what the obsession costs people who are not in it.'
    ],
    beat: 'The clearest look yet at who pays for his hunt, and it is never him.'
  },

  '1x05': { away: true, text: 'Off-screen this week. The ship is somewhere in the eastern sea, and Zuko is doing what he does between sightings: forms on the deck at dawn, harbour rumours, charts, a crew that has learned exactly how much silence to keep around him. Aang spends this episode being taught by a hundred-and-twelve-year-old friend that problems have to be approached from an angle nobody expects. Nobody has ever offered Zuko that lesson, and he would not have sat still for it.' },

  '1x06': { away: true, text: 'Off-screen, while the Fire Nation runs a prison rig full of earthbenders it has deliberately parked out of reach of the earth. Zuko has spent his entire life inside the nation that builds those and has never once been asked to look at one. In two seasons he will be living among the people they are for, in a refugee town, working in a tea shop, and it will change him more than any battle does.' },

  '1x07': {
    text: [
      'The trail goes inland and Zuko goes after it hard — and while he is gone, Iroh stops for a soak in a hot spring and gets himself taken by an Earth Kingdom patrol.',
      'Zuko turns the entire pursuit around without a second\'s deliberation. He finds the trail, catches the patrol, and walks into a squad of earthbenders alone to get his uncle back — arriving, as it happens, moments before they were going to kill him. He never frames it as a choice. He does not weigh the Avatar against Iroh, or complain about the delay, or mention afterwards what it cost him.',
      'Aang, meanwhile, gets clean away. Zuko does not bring it up.'

  },

  '1x08': {
    text: [
      'He follows Aang into Fire Nation waters on the solstice, which for a banished prince means sailing at the one thing more dangerous to him than the Avatar: his own navy, under an officer who would love the excuse. Zhao lets his damaged ship through the blockade on purpose, to follow it.',
      'Zuko goes into the Crescent Island temple alone, in disguise, and actually gets his hands on Aang — grabs him from behind at the sanctuary door, which has the accidental effect of shoving Aang through it and into the conversation with Roku that reorganises the entire series. Then the Fire Sages chain Zuko to a pillar next to the children he was hunting.',
      'And then Zhao arrives, takes the prize, takes Zuko\'s crew, and orders him held for execution as a traitor. He escapes with minutes to spare. He risked a death sentence at home for a boy he has never once managed to hold onto for longer than five minutes.'
    ],
    beat: 'Risks execution by his own side, and hands Aang the meeting that starts the countdown.'
  },

  '1x09': {
    text: [
      'A rare day where his plan is actually good. He finds the pirates hunting for their stolen scroll, works out that they and he want opposite things from the same children, and offers a straight trade: he gets the Avatar, they get the scroll.',
      'And then he does the meanest thing he does in Book One. He ties Katara to a tree, and instead of threatening her he takes out her mother\'s betrothal necklace — which he picked up on the prison rig — and holds it in front of her, and offers to give it back for Aang. It is small, precise, personal cruelty from someone who knows exactly what it is to have one object left from a mother who is gone, and the show does not let him off it.',
      'It falls apart the way everything does: the pirates work out the Avatar is worth more than a scroll and turn on him, Sokka talks the group out, and Zuko ends the day in the river watching a pirate ship burn.'
    ],
    beat: 'His most accurate cruelty, aimed at exactly the thing he understands best.'
  },

  '1x10': { away: true, text: 'Off-screen. In a forest a few hundred miles away, a boy Zuko\'s own age who lost his family to the Fire Nation is preparing to drown a valley to get even, and being told by everyone who loves him that he has gone too far. Zuko is somewhere at sea, running the same equation from the other side of it, and has not been told anything of the kind.' },

  '1x11': { away: true, text: 'Off-screen. Two tribes end a hundred years of hatred this week because someone tells them a better story about what happened. Zuko has one story about what happened to him, he has been telling it to himself for three years, and it ends with a homecoming.' },

  '1x12': {
    text: [
      'The episode that explains the whole man, and it is told about him rather than by him — Iroh gives it to the crew while Zuko is up on deck refusing to come inside.',
      'At thirteen he begged his way into a war council he was too young to attend and then spoke out of turn, because a general proposed sacrificing a division of new recruits as bait. Speaking was the disrespect. Ozai ruled that the boy who spoke in the war room must answer in an Agni Kai — and when Zuko turned to face his opponent, it was his father. He would not fight him. He knelt and begged. Ozai burned his face in front of the court and banished him, with one condition attached to coming home: find and capture the Avatar, a man who had been missing for a century. It was not a mission. It was a sentence dressed as one, and everybody in that room but Zuko knew it.',
      'And then the present-day half quietly does something enormous. In the middle of the storm he actually has Aang in sight — and he turns the ship away and orders them to safer water, and puts his crew ahead of the hunt for the first time in three years. Iroh watches him give the order and smiles at nothing in particular.'
    ],
    beat: 'The scar explained — and the first time he chooses something over the hunt.'
  },

  '1x13': {
    text: [
      'Zhao has the Avatar chained in Pohuai Stronghold, taken by the Yuyan archers, and Zuko cannot walk in and take him back as himself: he is a banished prince outranked by an admiral, with no crew and no standing. So he puts on a blue demon mask and stops being Prince Zuko for a night.',
      'And as the Blue Spirit he is extraordinary. Silent, fast, two dao swords, no fire — he does not use a single flame in the entire fortress, because fire would name him. He cuts Aang loose and the two of them go up a wall together in the best action sequence of Book One, and it works, and for about six minutes Zuko is competent, free and unencumbered by anybody\'s opinion of him.',
      'Then an archer drops him outside the wall, and he wakes to find the Avatar sitting next to him, waiting, talking about a Fire Nation boy he knew a hundred years ago and asking whether the two of them might have been friends. Zuko answers with a fireball and runs, because the offer is unbearable — and because he has just spent a night proving that the only version of himself that functions is the one with no name attached.'
    ],
    beat: 'The only version of him that works is the one wearing a mask.'
  },

  '1x14': { away: true, text: 'Off-screen, while a village hands every decision it makes to a fortuneteller and Aunt Wu tells a boy that it is his job to shape his own destiny. Zuko has had his future read to him exactly once, by his father, in an arena, and it was stated as a condition. He is still trying to satisfy it.' },

  '1x15': {
    text: [
      'The best-designed plan he has all season. He hires June, a bounty hunter with a shirshu — an animal that tracks by scent and cannot be shaken by flight, which solves the exact problem that has beaten him for fourteen episodes — and he pays for it with the thing he has been carrying since the prison rig: Katara\'s necklace, handed over as the scent to follow.',
      'And it works. It works better than anything he has tried. The shirshu takes them straight to the abbey, Zuko has Aang cornered against a wall, and for a few minutes the hunt is genuinely over.',
      'Then Sokka empties an abbey\'s worth of perfume into the air and the shirshu, which is functionally all nose, goes blind and starts lashing everything in reach — including Zuko, including June — and the whole thing ends with him paralysed on the ground in a cloud of scent while a bison flies away. Meanwhile his uncle spends the entire operation flirting with the bounty hunter. Zuko\'s single best plan of Book One, and it ends with him face down in perfume.'
    ],
    beat: 'Finally builds a plan that works, and it still ends with him in the dirt.'
  },

  '1x16': { away: true, text: 'Off-screen. This week a firebending master named Jeong Jeong tells the Avatar that fire is alive, that it only wants to consume, and that a bender\'s only real skill is restraint — and then Aang burns someone he loves by ignoring it. Nobody ever gave Zuko that lesson. He will get it eventually, from dragons, in Book Three, and it will take him two more years to be ready to hear it.' },

  '1x17': { away: true, text: 'Off-screen. In the mountains, an engineer is buying his colony\'s survival by building war balloons for the Fire Nation, a month at a time, because a minister threatened to burn them out otherwise. That is the machine Zuko is trying to be readmitted to. Within a fortnight it will report him dead and not much care.' },

  '1x18': {
    text: [
      'He reaches the northern fleet to discover that Zhao is now an Admiral, has been given the ships, the men and the campaign, and is being congratulated for it — three years of Zuko\'s life, handed to the man he beat in an Agni Kai. And Iroh has been asked to advise.',
      'Then Zhao hires pirates to plant explosives on his ship, and Zuko\'s vessel goes up in the harbour with everyone assuming he is aboard. The Fire Nation writes him off in an afternoon. Nobody investigates.',
      'And this is the strange, important part: it makes him free. For the first time since he was thirteen, no one in the world is watching him, expecting anything of him, or measuring him. So he cuts off his topknot, puts on a stolen infantry uniform, and walks up the gangplank of Zhao\'s own flagship as an anonymous soldier — riding to the North Pole inside the enemy\'s invasion, as nobody at all. It is the closest thing to a clean start he is offered in Book One, and he uses it to keep hunting.'
    ],
    beat: 'Officially dead, completely unwatched, and he spends the freedom on the same obsession.'

  '1x19': {

      'He is right. He surfaces inside the city half-frozen, finds the Spirit Oasis, and there is the Avatar — sitting on the grass, glowing faintly, with nobody home. Katara fights him for it and she is good now, genuinely good, and it takes him a long night to get past her.',
      'And then he picks Aang up. Three years of exile, an entire fleet, a nation, a father, and the thing he has been chasing since he was thirteen is unconscious and weightless over his shoulder. He walks out into a blizzard with it and does not look back, and it is the single most triumphant moment of his life so far.'
    ],
    beat: 'Everything he has wanted since he was thirteen, carried out in both arms.'
  },

  '1x20': {
    text: [
      'The blizzard nearly kills them both, and Zuko — who could simply let the Avatar freeze and still technically deliver a body — keeps him alive in a cave instead, and talks at him while he is unconscious about his father and his sister and how nothing was ever handed to him. It is the first time we hear him say any of it out loud, and he says it to someone who cannot hear.',
      'Then Katara catches them at sunrise and beats him. Cleanly. No trick, no interruption — the girl who could barely bend in episode one takes him apart in the snow, and the Avatar is gone again.',
      'And then the moon dies, and the world goes wrong, and Zuko finds Zhao in the streets and fights him — and when the Ocean Spirit comes up out of the harbour as a mountain of black water and takes hold of Zhao, Zuko reaches out and offers him his hand. The man who blew up his ship, stole his hunt and tried to have him executed. Zhao looks at it, and refuses it out of pride, and is pulled under.',
      'He ends Book One in an open boat with his uncle: no ship, no crew, no prize, no rank, no way home. And with the one piece of evidence that he was never really the person his father made him.'

window.ATLA = window.ATLA || {};
