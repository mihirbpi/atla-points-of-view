    beat: 'Takes the city, the Avatar and her brother in one episode, and never has a better day again.'
  }
});

</script>
<script>
/* =========================================================================
   Book Three: Fire — Aang
   ========================================================================= */

window.ATLA = window.ATLA || {};
window.ATLA.pov = window.ATLA.pov || {};
window.ATLA.pov.aang = window.ATLA.pov.aang || {};

Object.assign(window.ATLA.pov.aang, {

  '3x01': {
    text: [
      'He wakes up three weeks late on the deck of a Fire Nation ship with hair, which is the first visual joke and the first real signal — the arrow is covered, the monk is hidden, and for the whole first act of Book Three he is going to be someone else.',
      'What he cannot get past is the arithmetic. He was dead. Ba Sing Se fell while he was unconscious. The Earth Kingdom is gone, the invasion has to be rebuilt from nothing, and the world has been told the Avatar is dead — which is tactically useful and which he experiences as failure so total that he takes a glider into a storm at night rather than sit in it. Roku and Yue turn up in the water to tell him to keep going, which is the show being unusually direct about the fact that he is drowning on purpose.',
      'His friends find him on Crescent Island, and the decision he makes there is a genuinely new kind of decision for him: he agrees to stay dead. He burns his own glider — the last thing he owns from the temples, the thing he flew away on the night he ran — so that nobody can identify him. Book One Aang would never have done it. He is starting to be able to give things up, which is the exact skill the guru wanted and he is learning it in the ugliest possible way.'
    ],
    beat: 'Agrees to stay dead, and burns the glider he ran away on a hundred years ago.'
  },

  '3x02': {
    text: [
      'Hiding in the Fire Nation, he gets mistaken for a truant, and instead of correcting anyone he goes to school. He calls himself Kuzon, after a Fire Nation boy he was friends with a century ago, and he spends a week having the childhood he never had — sitting at a desk, being told off, making friends with people whose parents work for the war.',
      'And the thing he does with it is entirely him. The school forbids dancing. So he throws a dance party in a cave, teaches a room of rigid Fire Nation children the steps of four different nations, and watches them work out that their bodies are allowed to do this. When the headmaster raids it, the students all put on headbands so nobody can tell which one is him, and cover his escape.',
      'It is a small episode and it is the thesis for the season: the Fire Nation is full of people, the people are not the war, and the boy who is supposed to kill their leader keeps finding that out. It is also where he and Katara dance, which the show shoots exactly like the romance it is and then does not mention.'
    ],
    beat: 'Spends a week as a Fire Nation kid, and likes them — which complicates the rest of the season.'
  },

  '3x03': {
    text: [
      'He works out what Katara is doing about two nights before anyone else and does not tell her he knows. Then he turns up beside her in the fog in his own version of the disguise, and the two of them destroy the factory poisoning the village together.',
      'What is interesting is how completely he backs her. Sokka has a schedule and Sokka is right about the schedule — they are behind, the invasion is coming, and stopping to save one village of Fire Nation civilians is exactly the sort of thing they cannot afford. Aang does not weigh it. He is on her side before she has finished asking, because the whole shape of him is that the person in front of you is not an acceptable cost.',
      'And at the end, the actual Painted Lady turns up on the water and thanks her. The show quietly confirms that the spirit was watching and approved.'
    ],
    beat: 'Joins her deception without being asked, and does not once mention the schedule.'
  },

  '3x04': {
    text: [
      'He is barely in this one and his absence is the point. The episode opens with Aang, Katara and Toph solving a problem with three kinds of bending in about eleven seconds while Sokka holds the bags, and the rest of the hour is Sokka leaving to fix that.',
      'What Aang does contribute is a small unglamorous kindness — he is the one who notices Sokka has gone quiet, and does not push it.'
    ],
    beat: 'Wins a fight in eleven seconds and does not notice what it costs the one who could not.'
  },

  '3x05': {
    text: [
      'His half of the episode is being hunted by a man who can detonate things with his mind, and it is the first time the Avatar spends an entire episode simply hiding. Combustion Man does not duel him; he stands on a distant ridge and takes the ground apart.',
      'The contrast is doing all the work here. Across the water, four Fire Nation teenagers sit around a bonfire and say the truest things they have ever said to each other. Aang gets no bonfire and no confession, only a volcanic beach and something trying to kill him from half a mile away.',
      'Which is, in its way, a fair summary of what being the Avatar has been all season: everyone else gets to be a person for an evening.'
    ],
    beat: 'Spends the episode being hunted, while the villains get the character work.'
  },

  '3x06': {
    text: [
      'Roku finally tells him how the war started, and the answer is worse than a villain: Sozin and Roku were best friends. They grew up together, they were born on the same day, Sozin gave him a crown piece at his wedding. The Fire Lord who destroyed the Air Nomads was the boy who was pleased for his friend.',
      'And Roku is honest about his own part in it, which is the thing that lands hardest. He caught Sozin beginning the colonisation, he had him beaten and at his mercy, and he let him go — because they were friends — and gave him the twenty-five years he needed. Then the volcano took Roku\'s island, and Sozin came to help, and stopped halfway through and left him to die because a dead Avatar was more useful. Aang was born the same day.',
      'Aang\'s reading of it is the one Roku wants him to reject. He says he understands why Roku spared him. Roku says he was wrong to — that he should have been more decisive, and that Aang must be. The season\'s whole moral argument is set up here, by the previous Avatar, on the side of killing.'
    ],
    beat: 'Told by his own past life that mercy is what allowed all of this.'
  },

  '3x07': {
    text: [
      'Mostly on the sidelines of a fight between Katara and Toph that is really about mothers, and he is smart enough to stay out of it and not smart enough to be useful.',
      'What he does get is a warning. Combustion Man is beaten this time by a shot to the tattoo on his forehead — Sokka and Toph work out that the third eye is both the weapon and the weak point — and he walks away from it. He is not a monster of the week. He is coming back, he was paid for, and Aang still has no idea who is paying.'
    ],
    beat: 'Learns the assassin has a weakness, and that he is not going to stop.'
  },

  '3x08': {
    text: [
      'A horror episode, and Aang is the victim rather than the hero of it. Hama bloodbends him and Sokka into fighting each other in the moonlight — the Avatar, master of three elements, walked around like a puppet by an old woman who learned it in a cell.',
      'That is the important beat for him. He has spent two and a half seasons discovering the limits of his power, and this is a new one: there is a form of bending that makes the question of how strong you are irrelevant.',
      'And he watches Katara have to use it to save him. He does not say anything about that, then or later, which is one of the kinder things he does.'
    ],
    beat: 'Puppeted by an old woman, and watches Katara pay to get him back.'
  },

  '3x09': {
    text: [
      'Four days out and he cannot sleep, and the episode is a comedy about it right up until you notice what the nightmares are actually about. He is not afraid of dying. He dreams about being unprepared — no pants, oversleeping, arriving late, failing the test — because he has been told since he was twelve that the fate of the world is a piece of homework he did not do.',
      'Three days awake produces a truly deranged stretch of hallucination, and his friends run through their entire repertoire trying to fix him: Katara\'s yoga, Sokka in a false beard doing therapy, Toph\'s extremely violent massage. None of it works. What works is that they keep trying, and eventually he sleeps.',
      'He also daydreams about kissing Katara and covers it badly, which the show puts here on purpose, four days before he does it for real.'
    ],
    beat: 'His nightmare is not death. It is not being ready — which he is not.'
  },

  '3x10': {
    text: [
      'Everyone he has ever helped comes back. Haru and Tyro from the prison rig. The Mechanist and Teo from the temple. Pipsqueak and the Duke from Jet\'s forest. Bato and Hakoda and the Water Tribe, the swampbenders, the whole accumulated debt of three seasons of stopping to help people who could not help themselves, arriving in submarines. That is the invasion. Sokka found the date; Aang built the army by being unable to walk past anyone.',
      'And before it starts he kisses Katara, on a beach, because he might not come back, and then flies off before she can answer.',
      'The plan works. The eclipse arrives on schedule, the wall is breached, the eight minutes begin, and Aang blows the doors off the throne room — and it is empty. Ozai knew. Not by chance, and not by luck: someone told him months ago, and the whole season has been building to a room with nobody in it.'
    ],
    beat: 'The army he built by being kind arrives, and the throne room is empty.'
  },

  '3x11': {
    text: [
      'Eight minutes, and he spends most of them underground being talked at by the wrong person. Toph finds the bunker, they get through the door, and it is Azula — alone, powerless, in no danger at all, and stalling with total composure while the clock runs down. She tells them she has known about the invasion for months. She is enjoying it.',
      'By the time he gets out, the eclipse is over, the airships are up, and the invasion is finished. Aang does the arithmetic he has been avoiding: they cannot fight the Fire Nation head-on, and there will not be another eclipse.',
      'The adults surrender so the children can get away, which is a specific horror for him — Hakoda, Bato, the Mechanist, all of them staying so that Appa can carry the rest out. He flies to the Western Air Temple with a war he has now lost twice and a comet on the calendar.'
    ],
    beat: 'Loses his one shot to a girl who was never going to fight him, and leaves the adults behind.'
  },

  '3x12': {
    text: [
      'Zuko turns up at the Western Air Temple having rehearsed a speech, and delivers it badly, and every single person in the camp says no. Aang is the exception — he goes quiet rather than angry, which is worse — and the reason is not that he distrusts him. It is that he has asked this boy to be his friend roughly six times over two years and been answered with fire every time, and he does not know what to do with a yes.',
      'What settles it is that Zuko kills the assassin he hired. Sokka\'s boomerang finishes it, but Zuko is the one who stands in front of them and takes the shots first.',
      'So Aang says yes, and the reason he gives is the one he has been giving since the Blue Spirit: he needs a firebending teacher, and this is the person the universe keeps putting in front of him. He is the first to forgive and the least surprised. Katara takes Zuko aside afterwards and tells him she will kill him if he betrays them, and Aang is not in the room for that.'
    ],
    beat: 'Says yes immediately, because he has been asking this question since Book One.'
  },

  '3x13': {
    text: [
      'The first lesson is a disaster — Zuko\'s fire has gone weak and what he does produce burns Toph\'s feet, and Aang, who has not touched fire since he took the skin off Katara\'s hands eight months ago, watches it happen again in front of him and refuses to continue.',
      'So they go looking for where firebending came from, and find the Sun Warriors, and are made to carry a piece of the original flame up a mountain between them — a fire that cannot be dropped, cannot be smothered, and has to be kept alive by both of them at once, which is the whole point of the exercise and neither of them notices while they are doing it.',
      'At the top are Ran and Shaw, the last two dragons, who were supposed to be extinct because Fire Lords hunted them for glory. They do not fight; they dance. And they show him what the fire actually is: not a weapon, not the thing that killed his people, but energy and life, the same as breath. Aang comes off that mountain having stopped being afraid of an element for the first time in two seasons.',
      'It is the only bending he ever learns from the source rather than a teacher, and the show gives it to the one element he had refused.'
    ],
    beat: 'The element he renounced comes back, taught by dragons, as life rather than destruction.'
  },

  '3x14': {
    text: [
      'Sokka and Zuko go to break into a prison and do not tell him, and Aang spends the episode not knowing where two of his friends are. It is one of the few times the show separates him from a plot and simply lets him be worried.',
      'The one thing worth noting is what the absence says about the group. Sokka needed a hard, unsentimental partner for this and did not pick the Avatar, because the Avatar cannot walk into a Fire Nation prison and lie about who he is.'
    ],
    beat: 'Left behind for the first time by friends who needed someone he cannot be.'
  },

  '3x15': {
    text: [
      'Still at the temple, still waiting. And what comes back is Hakoda, and Suki, and an airship — a piece of the invasion recovered from a prison in a volcano by two boys with no plan and a lot of nerve.',
      'For Aang the significance is what it does to Katara. She has her father back. Zuko got him back for her. Nothing about that fixes anything between them yet, and it sets up the next episode entirely.'
    ],
    beat: 'Gets a piece of the invasion back, delivered by the person Katara will not forgive.'
  },

  '3x16': {
    text: [
      'His worst hour in Book Three, and the show is not on his side for most of it. Katara is going to find the man who killed her mother, and Aang tries to talk her out of it with a set of monk\'s aphorisms — that revenge is a two-headed rat viper, that she needs to forgive him — delivered to a girl whose mother was murdered, by a boy whose entire people were, who has never once been asked to forgive anyone to their face.',
      'He is not wrong about the principle. He is completely wrong about the standing, and Katara tells him so: it is easy to talk about forgiveness when the man who did it is not standing in front of you.',
      'And then she goes and does not kill him, on her own terms, for her own reasons — nothing to do with Aang\'s argument. When she comes back he tells her he is proud of her, and she corrects him: she did not forgive Yon Rha. She forgave Zuko.',
      'Aang is given a moral victory and told, precisely, that it was not his.'
    ],
    beat: 'Preaches forgiveness from a position he has never had to hold, and is corrected.'
  },

      'What he actually delivers is halting and bad, and every single person in the camp says no, and Katara says it hardest and most specifically. He deserves all of it. He hunted them for a year, he burned Kyoshi Island, he chained her to a tree, he chose Azula in the catacombs after she offered him the spirit water, and he hired the assassin currently trying to kill them.',

      'They let him in. He tells them the only true thing he has: that his suffering did not teach him anything about honour, and that he now thinks honour is doing the right thing, and that he does not expect them to believe him. Then Katara takes him aside and promises to kill him if he moves toward Aang, and he believes her, and it is a fair deal.'
    ],
    beat: 'Kills the assassin he hired, and is let in on probation by everyone but her.'
  },

  '3x13': {
    text: [
      'His firebending has gone weak, and he does not understand why, and his first lesson burns Toph\'s feet. He assumes he needs more rage. What has actually happened is that the rage is gone — he has stopped running on hatred and self-loathing, and the technique he was taught cannot function without them.',
      'So he and Aang go looking for where firebending came from, and find the Sun Warriors, who are not extinct, and are made to carry a piece of the eternal flame up a mountain — a fire that must be kept alive rather than thrown, between two people who spent two years trying to destroy each other.',
      'At the top: Ran and Shaw. The last two dragons in the world, the animals his own great-grandfather hunted for sport and his uncle claimed to have killed for a title — and Iroh lied about that, because he found them and they spared him.',
      'They do not fight. They dance the form the two boys learned from a wall carving, and the dragons show them what fire actually is: not a weapon but energy, and life, and the same thing as breath. Zuko comes down the mountain with his firebending back and coming from somewhere else entirely.',
      'The banished prince who was told he was not good enough at fire since he was thirteen turns out to have been taught it wrong by an entire nation.'

  '3x14': {
    text: [
      'Sokka goes to break his father out of a prison in a volcano and Zuko invites himself, and the reason is very simple: he owes them, and this is a thing he specifically can do. He knows the prison system, he knows how guards talk, and he can lie inside the Fire Nation fluently.',
      'What the episode is actually for is the two of them in a war balloon having a stilted conversation about girls, and it works — Zuko becomes a member of this group in a stolen balloon, awkwardly, over small talk, rather than in a speech.',

  '3x15': {
    text: [
      'A riot, a hostage, a gondola over boiling water — and at the far end of the line, Mai.',
      'She cuts the guards away from the cable and lets them go, and when Azula asks her how she could do this, Mai gives the flattest and most devastating answer in the series: she loves Zuko more than she fears Azula. And then Ty Lee blocks Azula\'s chi to stop her killing Mai, and Azula\'s two friends are dragged off to prison, and Azula is left standing on a platform alone.',
      'Zuko does not see most of it. What he does is get Sokka his father back — a thing he did not have to do, that nobody asked him for, that he never mentions afterwards. It is the act that eventually gets him forgiven, and he does not do it in order to be forgiven, which is the only reason it works.'

  '3x16': {

      'And then he goes, and he is very careful about what he does there. He does not argue for the killing, and he does not argue against it. He gets her to the man, he stands at her shoulder, and he lets her decide. Aang lectures; Zuko is silent, which is the only useful thing anyone offers her.',
      'And when it is done, she forgives him. Not because of the trip and not because of the man — she says it plainly: she did not forgive Yon Rha, and she never will. She forgave Zuko. He has spent three episodes being tolerated, and the last person in the group lets him in.'

  '3x17': {
    text: [
      'He is played by an actor with the scar on the wrong side who periodically screams about honour, and he is the only one who does not find any of it funny.',

  '3x18': {
    text: [

      'He also argues hardest that Aang has to kill his father, which is a genuinely strange thing to have to advocate and he does it without flinching, because he is the person in the room with the fewest illusions about Ozai.',

    beat: 'Argues for his own father\'s death, and then leads the hunt for the boy who refuses.'

  '3x19': {
    text: [
      'June cannot find Aang, so Zuko changes the target and gives her his uncle\'s sandal, and it works — the shirshu takes them to Ba Sing Se and an old man in a tent.',
      'And he has to go in and face him, and he has rehearsed nothing this time. He tells Iroh he is sorry, that he is ashamed of what he did, that he knows he does not deserve forgiveness — and Iroh embraces him before he has finished, and says he was never angry, he was sad, because he was afraid Zuko had lost his way. It is the release of two and a half seasons of tension in about eleven seconds and the show is right not to draw it out.',
      'Then Iroh refuses the job. Everyone wants him to fight Ozai; he will not, because history would record it as a brother killing a brother for a throne, and because it has to be the Avatar. And he gives Zuko the assignment instead: take the Fire Nation throne, and restore its honour. Zuko asks Katara to come with him, because Azula will be waiting.'

    beat: 'Apologises without a rehearsal, and is forgiven before he finishes the sentence.'

  '3x20': {
    text: [
      'He arrives for a coronation and finds his sister coming apart — banishing her own servants, arguing with an imaginary mother, unable to tell her two advisors apart — and he challenges her to an Agni Kai for the throne, alone, deliberately, because he thinks he can win this one and because he does not want Katara anywhere near it.',

      'The banished prince, who spent two seasons chasing a way to be loved by his father, dies for a Water Tribe girl who three episodes ago promised to kill him.'

    beat: 'Steps into the bolt on purpose, through the exact opening the technique cannot survive.'

  '3x21': {
    text: [

    beat: 'Healed by the girl he betrayed, crowned by the nation that exiled him, and looks at Iroh.'

<script>
/* =========================================================================
   Book Three: Fire — Iroh
   ========================================================================= */

window.ATLA = window.ATLA || {};

window.ATLA.pov.iroh = window.ATLA.pov.iroh || {};

Object.assign(window.ATLA.pov.iroh, {

  '3x01': {
    text: [
      'A cell in the Fire Nation capital, and he will not speak. Zuko comes down to explain himself and Iroh turns his back and says nothing at all, and it is the single most effective thing he does in the entire series.',
      'Because he could have lectured. He has never once run out of things to say to this boy, and he had two seasons of proverbs and tea and gentle questions, and none of it worked at Ba Sing Se. So he stops. He gives Zuko exactly nothing, and lets the silence do what the talking could not.',
      'It is also, plainly, grief. This is a man who gave up his country for a nephew who chose someone else, sitting in a cell, unable to look at him. The show lets both readings be true at once and never asks you to pick.'
    ],
    beat: 'Says nothing at all, and it works where two seasons of talking did not.'
  },

  '3x02': {
    text: [
      'Zuko comes back twice and Iroh still will not speak. The second time Zuko shouts and throws the food at the wall, and Iroh does not turn round.',
      'Meanwhile he is doing press-ups. In the cell, alone, at sixty-something, quietly building — the show gives you about four seconds of it and moves on, and it is the only warning you get that the old man is not waiting to be rescued. He is waiting for a date.'
    ],
    beat: 'Refuses to speak, and quietly starts training for a day already in the calendar.'
  },

  '3x03': { away: true, text: [
    'Off-screen, in a cell, while a Water Tribe girl saves a Fire Nation village from a Fire Nation factory and is thanked by a spirit for it.',
    'It is the exact thing Iroh spent Book Two trying to get Zuko to see: that the people under this war and the people running it are not the same people. He is currently a prisoner of the second group, in a cell, on purpose.'
  ]},

  '3x04': { away: true, text: [
    'Off-screen. This week a Fire Nation swordmaster takes a Water Tribe boy as a student, works out what he is on the first day, teaches him anyway, and gives him a white lotus tile.',
    'That is Iroh\'s society, and Piandao has just recruited into it. Every strange kind old man in this series has been quietly connected since episode four of Book One, and the network is being assembled for a date fifteen episodes away.'
  ]},

  '3x05': { away: true, text: [
    'Off-screen, while four Fire Nation teenagers sit around a bonfire and finally say the true things about themselves.',
    'Zuko\'s is that he is angry all the time and does not know right from wrong any more — which is precisely the question Iroh asked him at Lake Laogai and could not get an answer to. He says it to three people on a beach because the one person who wanted to hear it will not speak to him.'
  ]},

  '3x06': {
    text: [
      'He breaks the silence, and he picks the moment exactly.',
      'Zuko comes to the cell having read Sozin\'s final testament, and Iroh finally speaks — and what he gives him is the missing half: Avatar Roku was Zuko\'s mother\'s grandfather. The Fire Lord who started the war and the Avatar who failed to stop it are both in the boy\'s blood.',
      'And he frames it the way only he would. Not as a curse or an accident of lineage, but as the point: the conflict Zuko has been tearing himself apart with is the same conflict, and he is uniquely placed to end it. Iroh has been waiting to say this, and he waits until Zuko arrives having done the work himself.',
      'Two and a half seasons of teaching, and the lesson that finally lands is one Zuko had to walk into a catacomb and dig up alone.'

    beat: 'Breaks his silence for one revelation, and only once Zuko has found half of it himself.'
  },

  '3x07': { away: true, text: [
    'Off-screen, while a twelve-year-old is called The Runaway on a wanted poster and finally writes to her parents.',
    'Iroh, if asked, would say something about how the people who love us badly are still people who love us, and it would be slightly too neat, and it would be right.'

  '3x08': { away: true, text: [
    'Off-screen, while an old woman who survived a Fire Nation prison teaches a girl how to control the water inside a human body.',
    'Two old people this season, both imprisoned by the Fire Nation, both extremely dangerous, both waiting. Hama came out of her cell carrying what was done to her and spent the rest of her life doing it to strangers. Iroh comes out of his and liberates a city and then reopens a tea shop. The show is not subtle about running them in the same season.'
  ]},

  '3x09': { away: true, text: [
    'Off-screen, while his nephew takes a seat at Ozai\'s war table and is perfect at it — and then tells Mai, quietly, that it frightened him how easily the words came.',
    'That is the last thing that had to happen before Zuko broke. Iroh could not have engineered it and did not need to.'
  ]},

  '3x10': { away: true, text: [
    'Off-screen, in a cell, on the day of the invasion — which he has known about for as long as it has been planned, because the whole capital has.',
    'He has been doing press-ups for two months. The eclipse is eight minutes long. He does not need seven of them.'
  ]},

  '3x11': {
    text: [
      'He goes through the wall.',
      'The eclipse hits, every firebending guard in the prison is switched off for eight minutes, and the Dragon of the West — who has spent the entire season sitting silently in a cell growing a beard and doing press-ups — puts a hole through solid stone with his bare hands and walks out through the entire complex, unarmed, without needing his bending at all.',
      'It is one of the great reveals in the series and it lasts about ninety seconds. Everything about the old man that Book One played as a joke and Book Two played as tragedy pays off here as pure competence: he was never trapped, he was waiting for a date that a boy found in a library under a desert.',

    beat: 'Walks out of a Fire Nation prison through the wall, in the same eight minutes Zuko chooses.'

  '3x12': { away: true, text: [
    'Off-screen, and his absence is the whole texture of the episode. Zuko stands in front of the Avatar\'s camp trying to apologise and rehearses it three ways — sincere, then in Iroh\'s voice, complete with the proverbs, then in Azula\'s.',
    'He does the impression of his uncle because he does not have him. Iroh is somewhere in the Earth Kingdom assembling an army of old men, and Zuko is doing his voice at a groundhog.'

  '3x13': { away: true, text: [
    'Off-screen, while Zuko and Aang find Ran and Shaw — the last two dragons in the world, which Iroh has always known were alive.',
    'He hunted them, found them, was spared, and then told the Fire Nation he had killed the last dragon, which retired the sport and saved the species. He took the title "Dragon of the West" for a kill he did not make, and let his entire nation believe it, for fifty years, to protect two animals. He never told anyone, including Zuko, and this episode is where you find out.'

  '3x14': { away: true, text: [

  ]},

  '3x15': { away: true, text: [
    'Off-screen, while Mai chooses Zuko over Azula and says so to her face, and Ty Lee blocks Azula\'s chi to stop her killing her.',
    'Iroh built a relationship over three years on patience and being underestimated. Azula built hers in an afternoon on fear, and they last exactly as long as the fear does. The show runs the comparison the whole way and collects on it here.'
  ]},

  '3x16': { away: true, text: [
    'Off-screen, while Zuko takes Katara to the man who killed her mother and then says nothing at all for the whole confrontation.',
    'The restraint is Iroh\'s. It is the only thing Zuko does in the entire series that looks exactly like the way his uncle handles people: put them in front of the choice, and get out of the way.'
  ]},

  '3x17': { away: true, text: [
    'Off-screen, and he is on stage — the Ember Island Players portray him as an enormous gluttonous fool who cares about nothing but food.',
    'It is the popular Fire Nation view of the general who abandoned Ba Sing Se, and Zuko is the only person in the theatre who knows what the man actually is. He does not laugh at his uncle\'s scenes.'
  ]},

  '3x18': { away: true, text: [
    'Off-screen, and everyone is looking for him. Zuko says out loud what the whole audience has been thinking since the eclipse: that Iroh could beat Ozai, and that he should be the one to do it.',
    'The finale spends its second part explaining, carefully, why he will not.'
  ]},

  '3x19': {
    text: [
      'Four old men in a tent outside Ba Sing Se: Bumi, Jeong Jeong, Pakku and Piandao. The mad king who taught Aang to think sideways, the deserter who taught him restraint, the master who taught Katara, and the swordsman who taught Sokka — every extraordinary teacher in the series, in one place, and they are all in the same secret society.',
      'And Iroh is Grand Lotus. The lost Pai Sho tile in episode four of Book One turns out to have been the top of an organisation spanning all four nations, above the war and older than it, and he has been running it the whole time from a tea shop.',
      'Zuko comes in to apologise and Iroh embraces him before he finishes the sentence, and says he was never angry — he was sad, because he thought Zuko had lost his way.',
      'And then he refuses the job. Everyone wants him to kill his brother, and Iroh says no: history would record it as one brother killing another for a throne, and the world needs the Fire Lord defeated by the Avatar for the peace to mean anything. He will take Ba Sing Se back instead — the city that killed his son, which he besieged for six hundred days — and he tells Zuko to take the throne, because the Fire Nation needs a Fire Lord it can believe in.',
      'The most powerful firebender alive declines the climactic fight on the grounds that it would be bad for the story the world has to tell afterwards. It is the most Iroh decision imaginable.'
    ],
    beat: 'Grand Lotus, and he turns down the fight everyone wants him to have, on principle.'
  },

  '3x20': {
    text: [
      'He is at the wall of Ba Sing Se under the comet with four old masters and a lotus flag, doing the thing he failed to do at forty with an army of thousands.',
      'And the show is careful about the shape of it. He is not besieging the city. He is taking it back, and giving it away, which is the difference between the general he was and the man he became. He walks through the outer wall his own siege engines could not breach, at sixty-something, with a comet overhead and about five people.'
    ],
    beat: 'Breaches the wall he failed to take at forty, in order to hand the city back.'
  },

  '3x21': {
    text: [
      'He liberates Ba Sing Se, and then he does not stay to be thanked for it.',
      'At the coronation, Zuko offers him the throne — which is his, by birthright, which was stolen from him while he was grieving at that same wall — and Iroh refuses it in one sentence and tells his nephew that it is Zuko the Fire Nation needs. He has now turned down the crown, the climactic duel, and the credit, in the space of three episodes.',
      'And the last shot of the series is him in his tea shop. That is what he wanted the entire time — a room in Ba Sing Se, good tea, and the boy he stayed for sitting in it alive and at peace. Everything he did from the moment he woke up in a chair on a ship in episode one was aimed at that, and he never once said so.',
      'He pours the tea, and he watches Zuko laughing with the people who used to be the enemy, and he cries a bit, and does not explain why.'

<script>

   Book Three: Fire — Azula

window.ATLA = window.ATLA || {};

window.ATLA.pov.azula = window.ATLA.pov.azula || {};

Object.assign(window.ATLA.pov.azula, {

  '3x01': {
    text: [
      'She gave the kill to Zuko. That is how Book Three opens: Azula told their father that her brother struck down the Avatar, handed him the credit for the greatest victory in a century, and got him his banishment lifted and his place at the table back.',
      'And when Zuko asks why, she says it was a gift, and then adds — lightly, in the same breath — that if the Avatar turns out to be alive, it is Zuko who lied to the Fire Lord and Zuko who will answer for it.',
      'It is the single most elegant thing she does in the series. She has not forgiven him and she has not defeated him; she has simply arranged matters so that his life is now suspended from a thread she can cut at any moment, and made it look like generosity. Everyone in the palace thinks she is being kind. It is a leash worn as a medal.'
    ],
    beat: 'Hands her brother the credit for a kill she is not sure happened, as a leash.'
  },

  '3x02': { away: true, text: [
    'Off-screen, while her brother visits their uncle\'s cell twice and cannot get a word out of him.',
    'Azula would not understand what is happening there at all. In her model of the world, Iroh has no leverage over Zuko whatsoever — no rank, no freedom, nothing to offer or withhold. She has never once had to account for someone withholding affection and it costing something.'
  ]},

  '3x03': { away: true, text: [
    'Off-screen, while a Water Tribe girl destroys a Fire Nation factory to save a Fire Nation village.',
    'The factory poisoning its own people is not a failure of the system Azula was raised inside — it is a normal cost, correctly ranked. She would be able to explain, precisely, why the village does not matter, and she would not be exaggerating for effect.'
  ]},

  '3x04': { away: true, text: [
    'Off-screen, while a Fire Nation master teaches a Water Tribe boy the sword because he was the most dedicated student he had ever had.',
    'Piandao chose him for effort. Azula has never been chosen for effort in her life; she has been selected for capability since she was six, and it is one of the things quietly rotting underneath her.'
  ]},

  '3x05': {
    text: [
      'Ember Island, and the show takes her apart in twenty-two minutes without a single fight.',
      'She is extraordinary at war and helpless at everything else. She tries to flirt with a boy at a party and it comes out as a threat about dominating the earth together. She watches Ty Lee draw a crowd of boys effortlessly and asks her, genuinely, how it is done — and takes the coaching, and applies it badly, like a technique. She is not being written as a monster here; she is a fourteen-year-old with no idea how ordinary people work, and she knows she has no idea, and it embarrasses her.',
      'And then the bonfire, and the confession. Ty Lee joined a circus to be looked at. Mai was raised as furniture. Zuko is angry all the time. And Azula says, flatly and without inviting sympathy, that her mother thought she was a monster — and then adds that her mother was right, and that it still hurt.',
      'It is the only time in the series she says something true about herself, and she immediately defends against it by agreeing with it. Every single thing that happens to her in the last three episodes is contained in that sentence.'
    ],
    beat: 'Says her mother thought she was a monster, agrees, and admits it hurt anyway.'
  },

  '3x06': { away: true, text: [
    'Off-screen, while it emerges that her family descends from both Fire Lord Sozin and Avatar Roku.',
    'Azula is descended from Roku too, and the series never once brings it up in relation to her, which is its own comment. Zuko is told that the conflict in his blood is a gift. Nobody ever suggests Azula has a conflict in her at all, including Azula.'
  ]},

  '3x07': { away: true, text: [
    'Off-screen, while a girl and her almost-sister have a fight about mothers and then write a letter home.',
    'Azula\'s mother is gone, banished on the night Azulon died, and Azula has spent three seasons declining to mention it. There is no letter and no hawk. In eleven episodes she will be arguing with a hallucination of the woman in a mirror.'
  ]},

  '3x08': { away: true, text: [
    'Off-screen, while an old woman driven into an atrocity by a Fire Nation prison passes it to the next generation and is delighted to have done it.',
    'That prison is her family\'s. Azula has never been asked to look at what her nation makes, and the one time it is put in front of her — the Boiling Rock, in seven episodes — the person it has broken is going to be her own friend.'
  ]},

  '3x09': { away: true, text: [
    'Off-screen, while her brother sits at their father\'s war table and performs perfectly and is disturbed by how easy it was.',
    'Azula has been performing perfectly at that table since she was nine and has never once found it disturbing. That is the whole difference between them, and it is not that she is stronger.'
  ]},

  '3x10': { away: true, text: [
    'Off-screen, and everywhere. The invasion arrives exactly on schedule, the eclipse works exactly as designed, the plan is executed flawlessly, and the throne room is empty — because Azula has known about all of it for months and simply did not tell anyone she knew.',
    'She is not in this episode and she wins it.'
  ]},

  '3x11': {
    text: [
      'Eight minutes in a bunker with the Avatar, Sokka and Toph, and she is completely powerless — the eclipse has taken her firebending, she is alone, and she is outnumbered three to one by people who want to kill her.',
      'And she is never in the slightest danger, because she is not there to fight. She is there to spend the clock. She tells them she has known about the invasion for months. She goads Sokka about Suki, precisely, to make him lose the thread. She keeps them talking and moving and reacting for the entire eclipse, unarmed, and then the sun comes back and she leaves.',
      'It is the purest demonstration of what she is: her most complete victory in Book Three is achieved with no bending at all, against three benders, using nothing but information and timing.'
    ],
    beat: 'Beats three of them with no bending, in eight minutes, using only the clock.'
  },

  '3x12': { away: true, text: [
    'Off-screen, while her brother turns up at the Avatar\'s camp and asks to join, having told their father to his face that he is done.',
    'She has lost him. Not to a battle — she still has never lost a battle to Zuko — but to an argument she was not present for, made by an old man in a cell she thought was neutralised.'
  ]},

  '3x13': { away: true, text: [
    'Off-screen, while Zuko\'s firebending fails and he finds out why: he was running on hatred, the hatred is gone, and the technique he was taught cannot work without it.',
    'Azula\'s fire has never once failed and is about to. She generates lightning because there is no conflict in her, and the whole of the next six episodes is conflict arriving.'
  ]},

  '3x14': { away: true, text: [
    'Off-screen, while her brother and a Water Tribe boy walk into the most secure prison in the Fire Nation.',
    'Her friends are about to be at that prison. Mai\'s uncle runs it. Azula is going to arrive there in one episode and lose the two people she has, and she does not know yet that she has anything to lose.'
  ]},

  '3x15': {
    text: [
      'The episode where it starts. She corners the escaping gondola with Mai and Ty Lee, and she is winning again — and then Mai cuts the guards away from the cable and lets Zuko go.',
      'And Azula asks her, with genuine incomprehension, how she could do this. Mai\'s answer is the flattest line in the series: she loves Zuko more than she fears Azula. That is the sentence that ends her, and it is delivered in an ordinary voice by a girl she has known since she was seven.',
      'Azula turns to kill her, and Ty Lee blocks her chi from behind — the acrobat she recruited by setting a safety net on fire — and the Fire Lord\'s daughter goes down on a platform in front of the guards, taken out by the two people she brought.',
      'She has them both arrested, which is the only tool she has and is not the same as a solution. She built her friendships on fear because fear is more reliable than affection, and it held for exactly as long as she was the most frightening thing available, and Mai found something she cared about more. Everything after this is Azula alone.'
    ],
    beat: 'Both friends choose someone else, and the whole method comes apart in ninety seconds.'
  },

  '3x16': { away: true, text: [
    'Off-screen, while Katara stands over the man who killed her mother and chooses not to become him.',
    'It is the choice Azula is never offered and would never take. The series is quite deliberate about running her alongside a girl the same age with the same amount of rage and a different set of people around her.'
  ]},

  '3x17': { away: true, text: [
    'Off-screen, while a theatre full of Fire Nation civilians cheers a play in which the Fire Lord kills the Avatar.',
    'That is her country as it actually is, and she has never had a reason to doubt that it loves her family. In two episodes she will be crowned in front of it, and nobody she cares about will be in the audience.'
  ]},

  '3x18': {
    text: [
      'Her father makes himself Phoenix King, gives her the Fire Nation throne, and leaves to burn the Earth Kingdom without her.',
      'And she cannot hide what it does to her. She thanks him and asks — carefully, in the way you ask a thing you already know the answer to — why she is not coming, and Ozai explains that she is being given the Fire Nation, which is meant to sound like a promotion and is a dismissal. She has been left behind. The one person whose approval has been the entire architecture of her life has just handed her the least important job on the board and gone off with the comet.',
      'She is being made Fire Lord, and it lands as an abandonment, because it is one. Everything she has ever done was in exchange for that man\'s attention, and it turns out the price was never actually going to be paid.'
    ],
    beat: 'Handed a throne as a consolation prize, and understands exactly what it is.'
  },

  '3x19': { away: true, text: [
    'Off-screen, in a palace, alone, for the day before her coronation.',
    'Everyone else in the finale is assembling: four old masters in a tent, a lion turtle, a boy apologising to his uncle. Azula spends this stretch of the story with nobody, and the show simply does not cut to her, which is the loneliest thing it could have done.'
  ]},

  '3x20': {
    text: [
      'She comes apart, and the show does it in exactly the register it should — not madness as spectacle, but a person whose entire structure was other people\'s approval, with the approval removed.',
      'She banishes the servants for imagined slights. She banishes the Dai Li. She cannot tell Lo and Li apart and exiles one of them and then both. She sees her mother in the mirror and argues with her, and what her mother says is that she loves her, and Azula cannot accept that at all — it is the only thing anyone could say that she has no defence against.',
      'Zuko arrives for an Agni Kai and she takes it, alone, with nobody watching, which she would never have done six episodes ago. And she is losing. She is sloppy, her fire is wild, she cannot hold a line — and the moment she realises she cannot beat him, she does the thing she did to Iroh at Tu Zin and shoots the bystander.',
      'It is the same move and it does not work the same way. Zuko does not flinch or panic; he steps into it. And in doing so he takes the one thing she was actually good at — the perfect, cold, unanswerable shot — and makes it useless.'
    ],
    beat: 'Everything she was built out of is removed, and the shot that always worked stops working.'
  },

  '3x21': {
    text: [
      'She loses to plumbing. Katara does not out-power her — nobody out-powers Azula under a comet — she baits her onto a grate, freezes both of them into the water, thaws one hand and chains Azula\'s wrist to the metal. The greatest firebending prodigy in a century is defeated by a girl with a chain and a drain cover.',
      'And then the last image of her, which is one of the most upsetting things in the series and is not a fight. She is on the ground in the palace courtyard, chained to a grate, thrashing and breathing fire at nothing, and then she stops fighting it and simply screams and cries. Fourteen years old. No armour, no plan, no friends, no mother, no father, and a brother standing over her who does not look triumphant at all — Zuko just looks at her, and the show holds on his face, and neither of them says anything.',
      'She was never beaten by anything she could have prepared for. Mai loved someone more than she feared her; Ty Lee protected a friend; her father found her useful and then did not; Zuko stepped into a bolt. Every single thing that took her apart was a person caring about someone, which is the one variable she had removed from her model on purpose.',
      'The war ends. She does not get a tea shop.'
    ],
    beat: 'Undone entirely by people caring about each other, which she had designed out of her world.'
  }
});

</script>
<script>
/* =========================================================================
   Avatar — Points of View
   ========================================================================= */
(function () {
  'use strict';

  var D = window.ATLA;
  var EL = D.ELEMENTS;
  var CHARS = D.characters;
  var EPS = D.episodes;
  var BOOKS = D.books;

  /* ---- element sigils ------------------------------------------------- */

  var SIGILS = {
    air:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<g fill="currentColor">' +
      '<path d="M50 50 C50 27 63 13 82 17 C64 24 57 34 57 50 Z"/>' +
      '<path d="M50 50 C50 27 63 13 82 17 C64 24 57 34 57 50 Z" transform="rotate(120 50 50)"/>' +
      '<path d="M50 50 C50 27 63 13 82 17 C64 24 57 34 57 50 Z" transform="rotate(240 50 50)"/>' +
      '</g>' +
      '<circle cx="50" cy="50" r="5.5" fill="currentColor"/>',

    water:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M50 12 A38 38 0 0 1 50 88 A19 19 0 0 1 50 50 A19 19 0 0 0 50 12 Z" fill="currentColor"/>' +
      '<g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">' +
      '<path d="M31 34 A22 22 0 0 0 31 66"/>' +
      '<path d="M22 27 A32 32 0 0 0 22 73"/>' +
      '</g>',

    earth:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M50 16 L84 50 L50 84 L16 50 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>' +
      '<circle cx="50" cy="50" r="11" fill="currentColor"/>' +
      '<g fill="currentColor">' +
      '<rect x="46" y="20" width="8" height="8" transform="rotate(45 50 24)"/>' +
      '<rect x="46" y="72" width="8" height="8" transform="rotate(45 50 76)"/>' +
      '<rect x="20" y="46" width="8" height="8" transform="rotate(45 24 50)"/>' +
      '<rect x="72" y="46" width="8" height="8" transform="rotate(45 76 50)"/>' +
      '</g>',

    fire:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M50 13 C61 31 76 39 69 57 C64 70 55 75 50 89 C45 75 36 70 31 57 C24 39 39 31 50 13 Z" fill="currentColor"/>' +
      '<g fill="currentColor" opacity=".75">' +
      '<path d="M26 42 C20 55 23 66 31 74 C24 62 25 52 26 42 Z"/>' +
      '<path d="M74 42 C80 55 77 66 69 74 C76 62 75 52 74 42 Z"/>' +
      '</g>',

    metal:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M50 15 L80 32.5 L80 67.5 L50 85 L20 67.5 L20 32.5 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>' +
      '<path d="M50 33 L67 42.5 L67 57.5 L50 67 L33 57.5 L33 42.5 Z" fill="currentColor"/>',

    blood:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M50 16 C62 34 70 44 70 56 A20 20 0 0 1 30 56 C30 44 38 34 50 16 Z" fill="currentColor"/>' +
      '<g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
      '<path d="M24 30 A34 34 0 0 0 24 70"/><path d="M76 30 A34 34 0 0 1 76 70"/></g>',

    energy:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".65"/>' +
      '<g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">' + '<line x1="70.0" y1="50.0" x2="86.0" y2="50.0"/><line x1="64.1" y1="64.1" x2="75.5" y2="75.5"/><line x1="50.0" y1="70.0" x2="50.0" y2="86.0"/><line x1="35.9" y1="64.1" x2="24.5" y2="75.5"/><line x1="30.0" y1="50.0" x2="14.0" y2="50.0"/><line x1="35.9" y1="35.9" x2="24.5" y2="24.5"/><line x1="50.0" y1="30.0" x2="50.0" y2="14.0"/><line x1="64.1" y1="35.9" x2="75.5" y2="24.5"/>' + '</g>' +
      '<circle cx="50" cy="50" r="12" fill="currentColor"/>',

    lightning:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M58 10 L28 52 L46 52 L40 90 L72 46 L53 46 Z" fill="currentColor" ' +
      'stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',

    warrior:
      '<circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="2.4"/>' +
      '<path d="M19 80 C17 42 44 13 82 18 C56 29 41 49 40 78 Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle cx="50" cy="50" r="4" fill="none" stroke="currentColor" stroke-width="2"/>'
  };

  function svg(elKey, color) {
    return '<svg viewBox="0 0 100 100" style="color:' + color + '" ' +
           'xmlns="http://www.w3.org/2000/svg">' + (SIGILS[elKey] || '') + '</svg>';
  }

  /* ---- palette -------------------------------------------------------- */

  function paletteFor(charId, elKey) {
    var base = EL[elKey] || EL.water;
    var ov = (D.PALETTE_OVERRIDES[charId] || {})[elKey];
    return ov ? Object.assign({}, base, ov) : base;
  }

  /* ---- bending state at an episode ------------------------------------ */

  /* Ordered list of elements this character has any relationship with at
     episode `idx`, in the order they entered their life. */
  function bendingAt(char, idx) {
    var seen = {};
    var order = [];
    char.timeline.forEach(function (t) {
      if (t.at > idx) return;
      if (!seen[t.el]) { seen[t.el] = { el: t.el, state: t.state, at: t.at }; order.push(t.el); }
      else if (t.at >= seen[t.el].at) { seen[t.el].state = t.state; }
    });
    return order.map(function (k) { return seen[k]; });
  }

  /* Milestones firing on this exact episode. */
  function milestonesAt(char, idx) {
    var out = [];
    char.timeline.forEach(function (t) {
      /* episode 1 is the baseline everyone starts from, not an event */
      if (t.at !== idx || idx === 1) return;
      var label = (EL[t.el] || {}).label || t.el;
      if (t.state === 'learning')  out.push(label + ' — begins');
      if (t.state === 'mastered')  out.push(label + ' — mastered');
      if (t.state === 'renounced') out.push(label + ' — touched, and refused');
      if (t.state === 'partial')   out.push(label + ' — redirection, but never generation');
    });
    (char.marks || []).forEach(function (m) {
      if (m.at === idx) out.push(m.text);
    });
    return out;
  }

  /* ---- state ---------------------------------------------------------- */

  var state = { charId: CHARS[0].id, epIdx: 1 };

  function char() {
    return CHARS.filter(function (c) { return c.id === state.charId; })[0] || CHARS[0];
  }
  function ep() {
    return EPS.filter(function (e) { return e.idx === state.epIdx; })[0] || EPS[0];
  }
  function epsForBook(b) {
    return EPS.filter(function (e) { return e.book === b; });
  }

  /* ---- theme ---------------------------------------------------------- */

  function applyTheme() {
    var c = char();
    var bend = bendingAt(c, state.epIdx);
    if (!bend.length) bend = [{ el: c.timeline[0].el, state: 'mastered' }];

    var primary = paletteFor(c.id, bend[0].el);
    var root = document.documentElement.style;
    /* base is the primary element's deep, pulled toward true black so the
       individual corner colours stay legible against it */
    var base = mix(primary.deep, '#05070a', 72);

    root.setProperty('--core', primary.core);
    root.setProperty('--glow', primary.glow);
    root.setProperty('--deep', base);
    root.setProperty('--ink', primary.ink);

    /* elements that live in the four corners, and the one that does not */
    var ring = bend.filter(function (s) { return !(EL[s.el] || {}).centre; });
    var mid  = bend.filter(function (s) { return  (EL[s.el] || {}).centre; })[0];
    if (!ring.length) ring = bend;

    var corners = document.querySelectorAll('.sigil');
    for (var i = 0; i < 4; i++) {
      var slot = ring[i % ring.length];
      var pal = paletteFor(c.id, slot.el);
      root.setProperty('--c' + i, mix(pal.core, base, weightFor(slot.state)));
      root.setProperty('--g' + i, pal.glow);

      var node = corners[i];
      node.innerHTML = svg(slot.el, pal.glow);
      node.className = 'sigil on ' + (slot.state === 'mastered' ? '' : slot.state);
      node.setAttribute('data-el', slot.el);
    }

    var midNode = corners[4];
    if (mid) {
      var midPal = paletteFor(c.id, mid.el);
      midNode.innerHTML = svg(mid.el, midPal.glow);
      midNode.className = 'sigil on';
      root.setProperty('--c4', mix(midPal.core, base, 30));
    } else {
      midNode.innerHTML = '';
      midNode.className = 'sigil';
      root.setProperty('--c4', 'transparent');
    }

    document.getElementById('brandMark').innerHTML = svg(bend[0].el, primary.glow);
  }

  function weightFor(state) {
    return state === 'mastered' ? 62
         : state === 'learning' ? 34
         : state === 'partial'  ? 40 : 20;
  }

  /* crude hex mix so the wash sits on the page instead of glaring off it */
  function mix(hexA, hexB, pctA) {
    var a = hex(hexA), b = hex(hexB), p = pctA / 100;
    return 'rgb(' +
      Math.round(a[0] * p + b[0] * (1 - p)) + ',' +
      Math.round(a[1] * p + b[1] * (1 - p)) + ',' +
      Math.round(a[2] * p + b[2] * (1 - p)) + ')';
  }
  function hex(h) {
    if (h.indexOf('rgb') === 0) {
      return h.replace(/[^0-9,]/g, '').split(',').map(Number);
    }
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  /* ---- cast rail ------------------------------------------------------ */

  function renderCast() {
    var wrap = document.getElementById('cast');
    wrap.innerHTML = '';
    CHARS.forEach(function (c, i) {
      var first = bendingAt(c, state.epIdx)[0] || { el: c.timeline[0].el };
      var pal = paletteFor(c.id, first.el);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cast-btn';
      b.style.setProperty('--dot', pal.core);
      b.setAttribute('aria-pressed', c.id === state.charId ? 'true' : 'false');
      b.innerHTML =
        '<span class="cast-dot">' + svg(first.el, pal.ink) + '</span>' +
        '<span class="cast-text"><span class="cast-name">' + c.name + '</span></span>';
      b.title = c.name + ' — ' + c.epithet + '  (key ' + (i + 1) + ')';
      b.addEventListener('click', function () { go(c.id, state.epIdx); });
      wrap.appendChild(b);
    });
  }

  /* ---- book tabs + episode list --------------------------------------- */

  function renderTabs() {
    var wrap = document.getElementById('bookTabs');
    wrap.innerHTML = '';
    BOOKS.forEach(function (bk) {
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'book-tab';
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', ep().book === bk.id ? 'true' : 'false');
      t.disabled = !!bk.locked;
      t.innerHTML = '<b>' + bk.name + '</b><i>' +
        (bk.locked ? 'soon' : bk.subtitle) + '</i>';
      if (!bk.locked) {
        t.addEventListener('click', function () { go(state.charId, epsForBook(bk.id)[0].idx); });
      }
      wrap.appendChild(t);
    });
  }

  function renderEpisodes() {
    var c = char();
    var list = document.getElementById('episodeList');
    var current = ep();
    list.innerHTML = '';
    epsForBook(current.book).forEach(function (e) {
      var entry = (D.pov[c.id] || {})[e.id] || {};
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ep-btn' + (entry.away ? ' is-away' : '');
      if (e.idx === state.epIdx) b.setAttribute('aria-current', 'true');
      var flag = milestonesAt(c, e.idx).length ? '<span class="flag"></span>' : '';
      b.innerHTML = '<span class="n">' + pad(e.num) + '</span>' +
                    '<span class="t">' + e.title + flag + '</span>';
      b.addEventListener('click', function () { go(c.id, e.idx); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---- panel ---------------------------------------------------------- */

  function renderPanel() {
    var c = char(), e = ep();
    var book = BOOKS.filter(function (b) { return b.id === e.book; })[0];
    var entry = (D.pov[c.id] || {})[e.id];

    document.getElementById('epBook').textContent = book.name + ': ' + book.subtitle;
    document.getElementById('epNum').textContent = 'Chapter ' + e.num;
    document.getElementById('epTitle').textContent = e.title;
    document.getElementById('epLogline').textContent = e.logline;

    document.getElementById('whoName').textContent = c.name;
    document.getElementById('whoEpithet').textContent = c.epithet + ' · ' + c.house;

    document.getElementById('whoBlurb').textContent = c.blurb || '';

    /* bending chips */
    var chips = document.getElementById('bending');
    chips.innerHTML = '';
    bendingAt(c, state.epIdx).forEach(function (s) {
      var pal = paletteFor(c.id, s.el);
      var meta = EL[s.el] || {};
      var d = document.createElement('span');
      d.className = 'chip state-' + s.state;
      d.style.setProperty('--chip', pal.core);
      var stateText = (meta.stateLabels || {})[s.state] || s.state;
      d.innerHTML = '<i>' + svg(s.el, pal.ink) + '</i>' +
                    '<b>' + (meta.name || s.el) + '</b><s>' + stateText + '</s>';
      chips.appendChild(d);
    });

    /* prose */
    var pov = document.getElementById('pov');
    if (!entry) {
      pov.className = 'pov is-away';
      pov.innerHTML = '<span class="away-tag">Not yet written</span>' +
        '<p>This chapter has not been written from ' + c.name + '’s side yet.</p>';
    } else if (entry.away) {
      pov.className = 'pov is-away';
      pov.innerHTML = '<span class="away-tag">Elsewhere in the world</span>' +
        paras(entry.text);
    } else {
      pov.className = 'pov';
      pov.innerHTML = paras(entry.text) +
        (entry.beat ? '<p class="beat"><span>What changes</span>' + entry.beat + '</p>' : '');
    }

    /* milestones */
    var ms = document.getElementById('milestones');
    ms.innerHTML = '';
    milestonesAt(c, state.epIdx).forEach(function (m) {
      var d = document.createElement('div');
      d.className = 'milestone';
      d.textContent = m;
      ms.appendChild(d);
    });

    /* stepper */
    var all = epsForBook(e.book);
    var pos = all.indexOf(e);
    var prev = all[pos - 1], next = all[pos + 1];
    setStep('prevBtn', 'prevTitle', prev);
    setStep('nextBtn', 'nextTitle', next);

    var panel = document.getElementById('panel');
    panel.classList.remove('swap');
    void panel.offsetWidth;
    panel.classList.add('swap');
  }

  /* entry text may be a single string or an array of paragraphs */
  function paras(text) {
    var list = Object.prototype.toString.call(text) === '[object Array]' ? text : [text];
    return list.map(function (t) { return '<p>' + t + '</p>'; }).join('');
  }

  function setStep(btnId, labelId, target) {
    var btn = document.getElementById(btnId);
    btn.disabled = !target;
    document.getElementById(labelId).textContent = target ? target.title : '—';
    btn.onclick = target ? function () { go(state.charId, target.idx); } : null;
  }

  /* ---- routing -------------------------------------------------------- */

  function go(charId, epIdx) {
    state.charId = charId;
    state.epIdx = epIdx;
    render();
    try { history.replaceState(null, '', '#' + charId + '/' + ep().id); } catch (err) {}
  }

  function readHash() {
    var h = (location.hash || '').replace('#', '');
    if (!h) return;
    var parts = h.split('/');
    var c = CHARS.filter(function (x) { return x.id === parts[0]; })[0];
    var e = EPS.filter(function (x) { return x.id === parts[1]; })[0];
    if (c) state.charId = c.id;
    if (e) state.epIdx = e.idx;
  }

  function render() {
    applyTheme();
    renderCast();
    renderTabs();
    renderEpisodes();
    renderPanel();
    /* keep the current episode visible in the rail without scrolling the page */
    var active = document.querySelector('.ep-btn[aria-current="true"]');
    var list = document.getElementById('episodeList');
    if (active) {
      /* .episodes is position:relative, so offsetTop is already list-relative */
      var top = active.offsetTop;
      var bottom = top + active.offsetHeight;
      if (top < list.scrollTop) list.scrollTop = top - 8;
      else if (bottom > list.scrollTop + list.clientHeight) {
        list.scrollTop = bottom - list.clientHeight + 8;
      }
    }
  }

  /* ---- keyboard ------------------------------------------------------- */

  document.addEventListener('keydown', function (evt) {
    if (evt.metaKey || evt.ctrlKey || evt.altKey) return;
    var tag = (evt.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    var all = epsForBook(ep().book);
    var pos = all.indexOf(ep());

    if (evt.key === 'ArrowRight' && all[pos + 1]) {
      evt.preventDefault(); go(state.charId, all[pos + 1].idx);
    } else if (evt.key === 'ArrowLeft' && all[pos - 1]) {
      evt.preventDefault(); go(state.charId, all[pos - 1].idx);
    } else if (/^[1-9]$/.test(evt.key) && CHARS[+evt.key - 1]) {
      evt.preventDefault(); go(CHARS[+evt.key - 1].id, state.epIdx);
    }
  });

  window.addEventListener('hashchange', function () { readHash(); render(); });

  readHash();
  render();
})();

</script>
</body>
</html>
